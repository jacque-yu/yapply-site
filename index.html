<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yapply</title>
<meta name="description" id="meta-desc" content="Yapply is an AI career coach you talk to. It digs into what you have done, finds strengths you missed, and polishes your resume live while you talk.">
<link rel="canonical" id="canonical" href="https://yapply.ai/">
<script type="application/ld+json" id="ld">{}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a newsroom-style job desk. Ink-on-paper base, one highlighter yellow that marks
   the words Yapply "heard" in your story; cobalt for anything you can click. */
:root {
  --paper: #f4f5f0;
  --panel: #ffffff;
  --ink: #14162a;
  --muted: #5a5f74;
  --line: #dddfd6;
  --accent: #2b37d4;
  --accent-ink: #ffffff;
  --hi: #ffe04a;
  --hi-ink: #14162a;
  --good: #17825a;
  --warn: #b36b00;
  --bad: #b3362f;
  --soft: #eceee6;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  --wrap: 1160px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1120; --panel: #171a2c; --ink: #eceef6; --muted: #a3a8bf; --line: #2a2e46;
    --accent: #9aa2ff; --accent-ink: #0f1120; --hi: #f2cd2c; --hi-ink: #14162a;
    --good: #48c58d; --warn: #e0a243; --bad: #f07b72; --soft: #1d2136; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1120; --panel: #171a2c; --ink: #eceef6; --muted: #a3a8bf; --line: #2a2e46;
  --accent: #9aa2ff; --accent-ink: #0f1120; --hi: #f2cd2c; --hi-ink: #14162a;
  --good: #48c58d; --warn: #e0a243; --bad: #f07b72; --soft: #1d2136; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
img, svg { max-width: 100%; }
a { color: var(--accent); text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.1; text-wrap: balance; margin: 0 0 .5em; letter-spacing: -0.02em; }
h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); font-weight: 800; }
h2 { font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 750; }
h3 { font-size: 1.25rem; font-weight: 700; }
h4 { font-size: 1.02rem; font-weight: 700; letter-spacing: 0; }
p { margin: 0 0 1em; }
.prose { max-width: 68ch; }
.prose h2 { margin-top: 1.6em; }
.prose h3 { margin-top: 1.3em; }
.prose li { margin-bottom: .35em; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.mono { font-family: var(--mono); font-size: .85em; }
.num { font-variant-numeric: tabular-nums; }
mark, .mark { background: linear-gradient(transparent 12%, var(--hi) 12%, var(--hi) 88%, transparent 88%); color: var(--hi-ink); padding: 0 .15em; border-radius: 2px; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px); }
.section { padding: clamp(40px, 6vw, 72px) 0; }
.section + .section { border-top: 1px solid var(--line); }
.stack { display: grid; gap: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.grid-2 { display: grid; gap: 28px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); align-items: start; }
.eyebrow { font-family: var(--mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; display: block; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--ink); background: var(--panel); color: var(--ink); padding: 10px 18px; border-radius: 999px; font: 600 .95rem var(--body); cursor: pointer; text-decoration: none; transition: transform .12s ease, background .12s ease; }
.btn:hover { transform: translateY(-1px); }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: var(--line); }
.btn.sm { padding: 6px 12px; font-size: .85rem; }

/* header */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 22px; height: 64px; }
.logo { font: 800 1.45rem var(--display); color: var(--ink); text-decoration: none; letter-spacing: -0.04em; display: flex; align-items: center; gap: 8px; }
.logo .dot { width: 22px; height: 22px; border-radius: 6px; background: var(--hi); display: grid; place-items: center; }
.logo .dot i { display: block; width: 3px; border-radius: 2px; background: var(--hi-ink); margin: 0 1px; }
.nav { display: flex; gap: 4px; align-items: center; margin-left: 8px; }
.nav > * { position: relative; }
.nav a.nl, .nav button.nl { background: none; border: 0; font: 600 .95rem var(--body); color: var(--ink); padding: 8px 12px; border-radius: 8px; cursor: pointer; text-decoration: none; }
.nav a.nl:hover, .nav button.nl:hover, .nav .open > button.nl { background: var(--soft); }
.dd { position: absolute; top: calc(100% + 8px); left: 0; min-width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; box-shadow: 0 18px 40px rgba(10, 12, 30, .12); display: none; }
.open > .dd { display: grid; gap: 2px; }
.dd a { display: block; padding: 9px 12px; border-radius: 8px; color: var(--ink); text-decoration: none; }
.dd a:hover { background: var(--soft); }
.dd a b { display: block; font-weight: 700; font-size: .93rem; }
.dd a span { font-size: .82rem; color: var(--muted); }
.top .spacer { flex: 1; }
.menu-btn { display: none; }
@media (max-width: 880px) {
  .nav { display: none; position: absolute; top: 64px; left: 0; right: 0; background: var(--panel); flex-direction: column; align-items: stretch; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .nav.show { display: flex; }
  .dd { position: static; box-shadow: none; border: 0; padding: 0 0 0 12px; min-width: 0; }
  .menu-btn { display: inline-flex; }
  .top .login { display: none; }
}

/* url chip that maps prototype routes to production URLs */
.urlbar { font-family: var(--mono); font-size: .78rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 14px 0 0; }
.urlbar .path { background: var(--soft); border: 1px solid var(--line); padding: 2px 8px; border-radius: 6px; color: var(--ink); }
.crumbs { font-size: .85rem; color: var(--muted); }
.crumbs a { color: var(--muted); }

/* page head */
.phead { padding: 28px 0 32px; border-bottom: 1px solid var(--line); }
.phead p.lead { font-size: 1.15rem; color: var(--muted); max-width: 62ch; }
.answer { border-left: 4px solid var(--hi); background: var(--panel); padding: 14px 18px; border-radius: 0 var(--r) var(--r) 0; max-width: 72ch; }

/* cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.card h3 { margin-bottom: .35em; }
a.card { color: inherit; text-decoration: none; display: block; transition: border-color .15s ease, transform .15s ease; }
a.card:hover { border-color: var(--ink); transform: translateY(-2px); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: .75rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); white-space: nowrap; }
.tag.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 35%, transparent); background: color-mix(in srgb, var(--good) 10%, transparent); }
.tag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.tag.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.tag.hi { background: var(--hi); color: var(--hi-ink); border-color: transparent; }
.demo-note { display: inline-flex; gap: 6px; align-items: center; font-size: .78rem; color: var(--warn); border: 1px dashed color-mix(in srgb, var(--warn) 50%, transparent); padding: 3px 10px; border-radius: 999px; }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--soft); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

/* job list */
.jobs { display: grid; gap: 10px; }
.job { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.job:hover { border-color: var(--ink); }
.job .logo-sq { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font: 800 1rem var(--display); color: #fff; }
.job h4 { margin: 0; }
.job h4 a { color: var(--ink); text-decoration: none; }
.job h4 a:hover { text-decoration: underline; }
.job .meta { font-size: .85rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.job .side { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
@media (max-width: 600px) { .job { grid-template-columns: 44px 1fr; } .job .side { grid-column: 1 / -1; flex-direction: row; align-items: center; } }

/* filters & forms */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; }
label { font-size: .82rem; font-weight: 600; display: grid; gap: 5px; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 9px; padding: 9px 11px; min-width: 0; }
textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
.form { display: grid; gap: 14px; }
.form .two { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.out { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; white-space: pre-wrap; }

/* stats */
.stats { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.stat b { display: block; font: 800 1.9rem var(--display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.stat span { font-size: .83rem; color: var(--muted); }

/* hero voice demo */
.hero { padding: clamp(36px, 6vw, 80px) 0 clamp(40px, 6vw, 72px); }
.hero h1 { font-size: clamp(2.6rem, 6.4vw, 5rem); line-height: 1; }
.hero .grid-2 { align-items: center; }
.call { background: var(--ink); color: var(--paper); border-radius: 22px; padding: 22px; box-shadow: 0 30px 60px rgba(10, 12, 30, .22); }
:root[data-theme="dark"] .call { background: #1f2340; color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .call { background: #1f2340; color: var(--ink); } }
.call .bar { display: flex; justify-content: space-between; align-items: center; font: 600 .8rem var(--mono); opacity: .75; }
.wave { display: flex; gap: 3px; align-items: center; height: 46px; margin: 14px 0; }
.wave i { flex: 1; background: var(--hi); border-radius: 3px; height: 30%; animation: wv 1.2s ease-in-out infinite; }
@keyframes wv { 0%, 100% { height: 18%; } 50% { height: 92%; } }
@media (prefers-reduced-motion: reduce) { .wave i { animation: none; height: 50%; } * { transition: none !important; } }
.bubble { padding: 10px 14px; border-radius: 14px; margin: 8px 0; font-size: .95rem; max-width: 92%; }
.bubble.ai { background: rgba(255, 255, 255, .1); }
.bubble.me { background: rgba(255, 255, 255, .18); margin-left: auto; }
.bubble small { display: block; font: 600 .7rem var(--mono); opacity: .6; margin-bottom: 2px; letter-spacing: .05em; }
.resume-line { background: var(--panel); color: var(--ink); border-radius: 12px; padding: 12px 14px; margin-top: 12px; font-size: .9rem; border-left: 4px solid var(--hi); }

/* steps */
.steps { counter-reset: s; display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.step { position: relative; padding-top: 44px; }
.step::before { counter-increment: s; content: counter(s, decimal-leading-zero); position: absolute; top: 0; left: 0; font: 800 1.9rem var(--display); color: var(--accent); }

/* accordion */
details { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px; margin-bottom: 10px; }
summary { cursor: pointer; font-weight: 700; padding: 12px 0; }
details[open] summary { border-bottom: 1px solid var(--line); margin-bottom: 10px; }

/* chat demo */
.chat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; }
.chat .msg { padding: 10px 14px; border-radius: 12px; max-width: 88%; }
.chat .msg.ai { background: var(--soft); }
.chat .msg.me { background: var(--accent); color: var(--accent-ink); margin-left: auto; }

/* pricing */
.plans { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); }
.plan { background: var(--panel); border: 1.5px solid var(--line); border-radius: 18px; padding: 24px; display: grid; gap: 12px; align-content: start; }
.plan.featured { border-color: var(--ink); box-shadow: 8px 8px 0 var(--hi); }
.plan .price { font: 800 2.6rem var(--display); letter-spacing: -0.04em; }
.plan ul { margin: 0; padding-left: 18px; }

/* footer */
footer.site { border-top: 1px solid var(--line); margin-top: 40px; padding: 48px 0 28px; background: var(--panel); }
.fgrid { display: grid; gap: 28px; grid-template-columns: 1.3fr repeat(5, 1fr); }
.fgrid h5 { font: 700 .8rem var(--mono); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 12px; color: var(--muted); }
.fgrid ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; font-size: .9rem; }
.fgrid a { color: var(--ink); text-decoration: none; }
.fgrid a:hover { text-decoration: underline; }
.fbottom { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); font-size: .82rem; color: var(--muted); }
@media (max-width: 980px) { .fgrid { grid-template-columns: repeat(3, 1fr); } .fgrid .fbrand { grid-column: 1 / -1; } }
@media (max-width: 560px) { .fgrid { grid-template-columns: repeat(2, 1fr); } }

.cta-band { background: var(--ink); color: var(--paper); border-radius: 22px; padding: clamp(28px, 5vw, 48px); display: grid; gap: 14px; }
.cta-band h2 { color: var(--paper); }
:root[data-theme="dark"] .cta-band { background: #1f2340; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cta-band { background: #1f2340; } }
.cta-band .btn { border-color: var(--hi); background: var(--hi); color: var(--hi-ink); justify-self: start; }

.toc { position: sticky; top: 84px; font-size: .9rem; }
.toc a { display: block; padding: 4px 0; color: var(--muted); text-decoration: none; }
.toc a:hover { color: var(--ink); }
.layout-side { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 40px; }
@media (max-width: 900px) { .layout-side { grid-template-columns: 1fr; } .toc { position: static; } }

.meter { height: 12px; border-radius: 99px; background: var(--soft); overflow: hidden; border: 1px solid var(--line); }
.meter i { display: block; height: 100%; background: var(--accent); }
.bars { display: grid; gap: 8px; }
.bars .b { display: grid; grid-template-columns: 160px 1fr 48px; gap: 10px; align-items: center; font-size: .88rem; }
.bars .b .t { height: 14px; background: var(--soft); border-radius: 4px; overflow: hidden; }
.bars .b .t i { display: block; height: 100%; background: var(--muted); }
.bars .b.on .t i { background: var(--accent); }
.kbd { font-family: var(--mono); font-size: .8rem; background: var(--soft); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-size: .9rem; z-index: 50; }
.hidden { display: none !important; }

/* ---------- v2 components ---------- */
.prose table { display: block; overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.prose del { color: var(--muted); }
/* live resume demo */
.live { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; align-items: stretch; }
@media (max-width: 860px) { .live { grid-template-columns: 1fr; } }
.lv-chat { max-height: 330px; overflow: auto; }
.paper { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px 26px; box-shadow: 0 18px 40px rgba(10, 12, 30, .08); font-size: .95rem; }
.paper h5 { font: 700 .72rem var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 4px; margin: 14px 0 6px; }
.paper ul { margin: 4px 0; padding-left: 18px; }
.paper li { margin-bottom: 4px; min-height: 1.4em; }
.flash { animation: fl 1.4s ease-out; border-radius: 4px; }
@keyframes fl { 0% { background: var(--hi); } 100% { background: transparent; } }
/* chips + keyword chips */
.chip { font: 600 .82rem var(--body); padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.chip:hover { border-color: var(--ink); }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.kw { font-size: .75rem; padding: 3px 9px; border-radius: 6px; background: var(--soft); border: 1px solid var(--line); color: var(--ink); }
.kw b { color: var(--accent); margin-left: 2px; }
.kw i { color: var(--muted); font-style: normal; }
/* data slot */
.slot { display: grid; gap: 4px; border: 1.5px dashed var(--line); border-radius: 12px; padding: 14px 16px; color: var(--muted); background: color-mix(in srgb, var(--soft) 50%, transparent); }
.slot b { color: var(--ink); }
/* companies directory */
.marquee { overflow: hidden; border-block: 1px solid var(--line); padding: 10px 0; display: grid; gap: 8px; background: var(--panel); }
.mq-row { display: flex; gap: 14px; width: max-content; animation: mq 60s linear infinite; }
.mq-row.rev { animation-direction: reverse; animation-duration: 75s; }
@keyframes mq { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .mq-row { animation: none; flex-wrap: wrap; width: auto; } .mq-row.rev { display: none; } }
.tk { display: inline-flex; align-items: center; gap: 8px; font-size: .85rem; padding: 4px 12px 4px 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); white-space: nowrap; }
.co-logo { display: inline-grid; place-items: center; border-radius: 10px; color: #fff; font: 800 1rem var(--display); flex: none; }
.co-grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.co-card { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; color: inherit; text-decoration: none; transition: transform .15s ease, border-color .15s ease; }
.co-card:hover { transform: translateY(-3px); border-color: var(--ink); }
.co-banner { height: 92px; position: relative; }
.co-badge { position: absolute; top: 10px; right: 10px; font-size: .72rem; font-weight: 600; background: rgba(255, 255, 255, .92); color: #14162a; padding: 3px 10px; border-radius: 999px; }
.co-body { padding: 0 18px 18px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.co-body .co-logo { margin-top: -26px; border: 3px solid var(--panel); box-sizing: content-box; position: relative; z-index: 1; }
.co-body h3 { margin: 10px 0 2px; }
.co-body p { margin: 0; }
/* company page */
.co-head { padding: 28px 0 0; border-bottom: 1px solid var(--line); }
.co-tabs { display: flex; gap: 4px; margin-top: 20px; overflow-x: auto; }
.co-tabs a { padding: 10px 14px; color: var(--muted); text-decoration: none; font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap; }
.co-tabs a.on { color: var(--ink); border-bottom-color: var(--accent); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: .9rem; margin: 8px 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; }
.sim { display: flex; gap: 10px; align-items: center; padding: 8px 0; color: inherit; text-decoration: none; border-top: 1px solid var(--line); }
.sim:hover b { text-decoration: underline; }
.cal { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
.cal div { height: 44px; border-radius: 6px; background: var(--soft); display: grid; place-items: end center; padding-bottom: 4px; font-size: .72rem; color: var(--muted); border: 1px solid var(--line); }
.cal div.on { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--ink); font-weight: 600; border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.cal div.start { background: var(--accent); color: var(--accent-ink); }
/* guides timeline */
.tl { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; position: relative; }
.tl::before { content: ""; position: absolute; left: 4%; right: 4%; top: 22px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 58%, var(--line) 58%); }
.tl-step { position: relative; display: grid; justify-items: start; gap: 4px; text-align: left; background: none; border: 0; padding: 0 12px 0 0; cursor: pointer; color: var(--ink); font: inherit; }
.tl-dot { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: 3px solid var(--accent); font: 800 1.1rem var(--display); color: var(--accent); position: relative; z-index: 1; margin-bottom: 8px; transition: transform .15s ease; }
.tl-step:hover .tl-dot { transform: scale(1.08); }
.tl-step.now .tl-dot { background: var(--hi); border-color: var(--ink); color: var(--hi-ink); box-shadow: 0 0 0 6px color-mix(in srgb, var(--hi) 40%, transparent); }
.tl-when { font: 600 .72rem var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tl-step b { font: 700 1.05rem var(--display); }
.tl-what { font-size: .85rem; color: var(--muted); line-height: 1.4; }
.tl-c27 { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-n { font-size: .8rem; font-weight: 700; color: var(--accent); margin-top: 4px; }
@media (max-width: 900px) {
  .tl { grid-template-columns: 1fr; gap: 18px; }
  .tl::before { left: 22px; right: auto; top: 0; bottom: 0; width: 4px; height: auto; background: linear-gradient(180deg, var(--accent) 0%, var(--accent) 58%, var(--line) 58%); }
  .tl-step { grid-template-columns: 48px 1fr; column-gap: 14px; padding: 0; }
  .tl-step > *:not(.tl-dot) { grid-column: 2; }
  .tl-dot { grid-row: 1 / span 6; }
}
.stage-num { font: 800 2.4rem var(--display); color: var(--accent); letter-spacing: -0.04em; }
.guide-card h3 { font-size: 1.1rem; }
/* glossary */
.az { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 22px; position: sticky; top: 64px; background: var(--paper); padding: 8px 0; z-index: 5; border-bottom: 1px solid var(--line); }
.az a, .az span { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; font: 700 .9rem var(--mono); text-decoration: none; }
.az a { color: var(--ink); background: var(--panel); border: 1px solid var(--line); }
.az a:hover { border-color: var(--ink); }
.az span { color: var(--line); }
.gl-letter { scroll-margin-top: 120px; margin-bottom: 28px; }
.gl-letter > h2 { font-size: 2rem; color: var(--accent); }
.legal h3 { font-size: 1.05rem; margin-top: 1em; }
.stack { align-content: start; }
.layout-side > aside { align-self: start; }
.stats.two { grid-template-columns: repeat(2, minmax(0, 1fr)); align-self: center; }
/* synonym pages */
.intent-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.intent { text-align: left; display: grid; gap: 4px; background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; font: inherit; color: var(--ink); }
.intent:hover { border-color: var(--ink); }
.intent span { font-size: .82rem; color: var(--accent); font-weight: 600; }
.best-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); margin-top: 14px; }
.best { display: grid; grid-template-columns: 30px 1fr; column-gap: 10px; align-items: baseline; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.best > *:not(.best-n) { grid-column: 2; }
.best-n { grid-row: span 2; font: 800 1.3rem var(--display); color: var(--accent); }
.best b { font: 700 1.15rem var(--display); }
.syn-sec { scroll-margin-top: 80px; }
/* ICP + SEO copy blocks */
.h1-kicker { display: block; font: 600 .8rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
.stat-band { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); margin-top: 22px; }
.stat-band > div { border-top: 3px solid var(--ink); padding-top: 14px; }
.stat-band b { display: block; font: 800 2.4rem var(--display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.icp-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.icp { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.icp h3 { margin: 0; font-size: 1.1rem; }
.icp-k { position: absolute; top: 14px; right: 16px; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--hi); color: var(--hi-ink); font: 800 1rem var(--display); }
.icp-pain { font: 600 1.02rem/1.4 var(--display); margin: 2px 0; }
.icp .ba { background: var(--soft); border-radius: 10px; padding: 10px 12px; margin-top: auto; }
.icp .ba p { margin: 4px 0; }
.small-icp .icp-pain { font-size: .95rem; }
.signals { counter-reset: sg; list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.signals li { counter-increment: sg; display: grid; grid-template-columns: 34px 1fr; column-gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.signals li::before { content: counter(sg); grid-row: span 2; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent); display: grid; place-items: center; font: 800 .9rem var(--display); }
.signals li > * { grid-column: 2; }

/* ===== Coach positioning: roomy layout, serif display, hero stage, call, report ===== */
:root { --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif; --wrap: 1240px; }
.serif { font-family: var(--serif); font-weight: 400; letter-spacing: -0.01em; }
h1.serif, h2.serif { font-weight: 400; }
h2.serif { font-size: clamp(2.2rem, 4.2vw, 3.4rem); line-height: 1.04; margin: 0 0 14px; }
.section.roomy { padding: clamp(72px, 10vw, 136px) 0; }
.sec-head { max-width: 760px; margin-bottom: clamp(36px, 5vw, 60px); }
.sec-head p { font-size: 1.12rem; line-height: 1.65; }
.narrow { max-width: 860px; }
.btn.lg { padding: 15px 26px; font-size: 1.02rem; border-radius: 999px; }
.row.center { justify-content: center; }

/* Hero */
.hero2 { padding: clamp(20px, 3vw, 36px) 0 clamp(56px, 8vw, 104px); }
.h2-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); gap: clamp(28px, 4vw, 56px); align-items: stretch; }
.h2-left { display: flex; flex-direction: column; padding-top: clamp(24px, 4vw, 56px); }
.h2-left h1 { font-size: clamp(3rem, 6vw, 5.6rem); line-height: 0.95; letter-spacing: -0.025em; margin: 22px 0 0; }
.h2-bottom { margin-top: auto; padding-top: 48px; }
.h2-lead { font-size: 1.14rem; line-height: 1.65; color: var(--muted); max-width: 52ch; margin: 0 0 26px; }
.h2-lead b { color: var(--ink); font-weight: 600; }
.proof { display: inline-flex; align-items: center; gap: 10px; margin: 0; color: var(--muted); font-size: .95rem; }
.pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 rgba(23,130,90,.5); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(23,130,90,0); } 100% { box-shadow: 0 0 0 0 rgba(23,130,90,0); } }

.stage { position: relative; min-height: clamp(520px, 62vw, 760px); border-radius: 28px; overflow: hidden; background: #2a2730; color: #fff; isolation: isolate; }
.st-img { position: absolute; inset: 0; background-size: cover; background-position: center; transition: background-image .6s ease; z-index: -2; }
.st-shade { position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(10,10,20,.35) 0%, rgba(10,10,20,0) 26%, rgba(10,10,20,0) 50%, rgba(10,10,20,.72) 100%); }
.avs { position: absolute; top: 22px; left: 22px; display: flex; gap: 10px; }
.av { width: 54px; height: 54px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); background-size: cover; background-position: center 20%; cursor: pointer; position: relative; padding: 0; opacity: .8; transition: transform .2s, opacity .2s, border-color .2s; }
.av b { position: absolute; right: -4px; bottom: -4px; width: 22px; height: 22px; border-radius: 50%; background: var(--hi); color: var(--hi-ink); font: 800 .72rem var(--display); display: grid; place-items: center; }
.av[aria-pressed="true"] { opacity: 1; border-color: #fff; transform: scale(1.08); box-shadow: 0 0 0 4px rgba(255,255,255,.25); }
.av:focus-visible { outline: 3px solid var(--hi); outline-offset: 3px; }
.bub { position: absolute; max-width: min(360px, 62%); padding: 14px 18px; border-radius: 22px; font-size: 1rem; line-height: 1.4; box-shadow: 0 12px 32px rgba(0,0,0,.22); opacity: 0; transform: translateY(8px); }
.bub.in { animation: bubin .5s ease forwards; }
.b-ai { top: 24%; right: 6%; background: rgba(40,40,52,.62); backdrop-filter: blur(14px); color: #fff; }
.b-me { top: 44%; left: 7%; background: #fff; color: #14162a; animation-delay: .9s !important; }
.b-line { bottom: 108px; right: 6%; background: #fffdf0; color: #14162a; font-size: .92rem; max-width: min(380px, 70%); animation-delay: 1.8s !important; }
.b-line small { display: block; font: 600 .68rem var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--good); margin-bottom: 4px; }
.b-line mark { background: var(--hi); padding: 0 2px; }
@keyframes bubin { to { opacity: 1; transform: none; } }
.st-foot { position: absolute; left: 24px; right: 24px; bottom: 24px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.st-who b { display: block; font: 600 1.25rem var(--display); }
.st-who span { opacity: .82; font-size: .95rem; }
.st-call { display: inline-flex; align-items: center; gap: 10px; background: #fff; color: #14162a; text-decoration: none; padding: 14px 22px; border-radius: 999px; font-weight: 700; white-space: nowrap; box-shadow: 0 10px 26px rgba(0,0,0,.25); }
.st-call:hover { transform: translateY(-1px); }

/* How it works */
.how3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: clamp(24px, 4vw, 56px); }
.how3 .n { display: block; font-size: 4rem; line-height: 1; color: var(--accent); }
.how3 h3 { font-size: 1.35rem; margin: 14px 0 10px; }
.how3 p { line-height: 1.7; }

/* Dark stat section */
.dark-sec { background: #14162a; color: #eceef6; border-top: 0 !important; }
.dark-sec + .section { border-top: 0; }
.dark-sec .eyebrow { color: #ffe04a; }
.dark-sec .sec-head p { color: #b9bdd3; }
.stat-band { gap: clamp(24px, 4vw, 56px); }
.stat-band > div { border-top: 1px solid rgba(255,255,255,.22); padding-top: 22px; }
.dark-sec .stat-band b { font: 400 clamp(3rem, 6vw, 4.6rem)/1 var(--serif); color: #fff; margin-bottom: 14px; }
.dark-sec .stat-band p { color: #c9ccdd; line-height: 1.6; }
.dark-sec .stat-band a { color: #9aa2ff; }

/* Who */
.who-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: clamp(20px, 3vw, 36px); }
.who-card { background: var(--panel); border-radius: 28px; overflow: hidden; border: 1px solid var(--line); display: flex; flex-direction: column; }
.wc-img { position: relative; aspect-ratio: 5 / 4; background-size: cover; background-position: center 30%; color: #fff; display: flex; flex-direction: column; justify-content: flex-end; padding: clamp(22px, 3vw, 34px); }
.wc-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,8,18,0) 30%, rgba(8,8,18,.82) 100%); }
.wc-img > *:not(.wc-shade) { position: relative; }
.wc-tag { position: absolute !important; top: 22px; left: 22px; display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.92); color: #14162a; border-radius: 999px; padding: 6px 14px 6px 6px; font: 600 .85rem var(--body); }
.wc-tag b { width: 26px; height: 26px; border-radius: 50%; background: var(--hi); display: grid; place-items: center; font: 800 .8rem var(--display); }
.who-card blockquote { margin: 0; font-size: clamp(1.9rem, 3vw, 2.6rem); line-height: 1.08; text-shadow: 0 2px 18px rgba(0,0,0,.35); }
.wc-who { margin: 12px 0 0; font-size: .95rem; opacity: .85; }
.wc-body { padding: clamp(22px, 3vw, 34px); display: flex; flex-direction: column; gap: 18px; flex: 1; }
.wc-body > p { margin: 0; font-size: 1.05rem; line-height: 1.65; }
.wc-ba { display: grid; gap: 10px; }
.wc-ba p { margin: 0; padding: 14px 16px; border-radius: 14px; font-size: .95rem; line-height: 1.5; }
.wc-ba small { display: block; font: 600 .68rem var(--mono); letter-spacing: .07em; text-transform: uppercase; margin-bottom: 4px; }
.wc-ba .b { background: var(--soft); color: var(--muted); }
.wc-ba .b small { color: var(--bad); }
.wc-ba .a { background: #fffbe0; color: #14162a; }
.wc-ba .a small { color: var(--good); }
.wc-ba mark { background: var(--hi); padding: 0 2px; }
.wc-link { margin-top: auto; font-weight: 600; }

/* Signals, features */
.signals-wrap { align-items: start; gap: clamp(32px, 6vw, 96px); }
.signals { gap: 14px; }
.signals li { padding: 18px 20px; border-radius: 16px; }
.feat-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; }
.feat { position: relative; display: block; padding: 28px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); text-decoration: none; color: inherit; transition: border-color .2s, transform .2s; }
.feat:hover { border-color: var(--ink); transform: translateY(-2px); }
.feat h3 { margin: 8px 0 8px; font-size: 1.2rem; }
.feat .go { position: absolute; top: 24px; right: 26px; color: var(--accent); font-size: 1.2rem; }
.vs-line { margin-top: 40px; padding: 24px 28px; border-radius: 18px; background: var(--soft); display: flex; justify-content: space-between; gap: 20px; align-items: center; flex-wrap: wrap; }
.vs-line p { margin: 0; max-width: 80ch; }

/* Live demo spacing */
.live { gap: 24px; }

/* Lobby */
.lobby { padding: clamp(64px, 10vw, 120px) 0; text-align: center; }
.lobby-in { max-width: 760px; }
.lobby h1 { font-size: clamp(3rem, 7vw, 5.4rem); line-height: 1; margin: 34px 0 16px; }
.lobby .lead { font-size: 1.15rem; line-height: 1.65; margin: 0 auto 30px; max-width: 56ch; }
.orb { width: 96px; height: 96px; border-radius: 50%; margin: 0 auto; background: radial-gradient(circle at 35% 30%, #fff 0, #ffe04a 30%, #f2a93b 62%, #2b37d4 100%); box-shadow: 0 0 0 10px rgba(255,224,74,.14), 0 18px 50px rgba(43,55,212,.35); animation: breathe 3.2s ease-in-out infinite; }
.orb.big { width: 140px; height: 140px; }
@keyframes breathe { 50% { transform: scale(1.06); box-shadow: 0 0 0 18px rgba(255,224,74,.08), 0 18px 60px rgba(43,55,212,.4); } }
.lobby-ps { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 14px; text-align: left; }
.lp { display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); text-decoration: none; color: inherit; }
.lp:hover { border-color: var(--ink); }
.lp b { display: block; }
.lp small { color: var(--muted); font-size: .78rem; }
.lp-img { width: 44px; height: 44px; flex: none; border-radius: 50%; background-size: cover; background-position: center 25%; display: inline-block; }
.lp-img.sm { width: 46px; height: 46px; }

/* Call screen */
.callscr { background: #101223; color: #eceef6; padding: clamp(28px, 4vw, 48px) 0 clamp(48px, 6vw, 80px); min-height: 80vh; }
.cs-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,.1); }
.live-dot { font: 600 .75rem var(--mono); color: #ff6b6b; letter-spacing: .1em; }
.live-dot::before { content: "●"; margin-right: 6px; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.clk { font: 600 1rem var(--mono); }
.btn.ghost-d { background: transparent; color: #eceef6; border-color: rgba(255,255,255,.3); }
.cs-grid { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: clamp(24px, 4vw, 48px); margin-top: 32px; }
.cs-left { text-align: center; }
.cs-left .orb { margin-top: 12px; }
.callscr.talking .orb { animation-duration: 1.2s; }
.cap { opacity: .75; margin: 18px 0 8px; font-size: .95rem; }
.cs-left .wave { justify-content: center; margin: 0 auto 18px; max-width: 360px; }
.tx { text-align: left; max-height: 420px; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 6px; }
.tx .bubble.ai { background: #1f2238; color: #eceef6; }
.tx .bubble.me { background: #2b37d4; color: #fff; }
.cs-meter { margin: 0 0 12px; opacity: .85; }
.cs-meter b { color: #ffe04a; font-size: 1.05rem; }
.rp { color: #14162a; background: #fff; border-radius: 18px; padding: clamp(22px, 3vw, 34px); }
.rp-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.rp ul { padding-left: 18px; }
.rp li { position: relative; margin-bottom: 8px; line-height: 1.55; border-radius: 6px; }
.rp .ghost { color: #a3a8bf; font-style: italic; }
.rec { display: inline-block; width: 8px; height: 8px; background: #e5484d; border-radius: 50%; margin-right: 8px; animation: blink 1.2s infinite; }
.kind-chip { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px; background: #e9f7ef; color: var(--good); font: 600 .66rem var(--mono); letter-spacing: .04em; text-transform: uppercase; vertical-align: middle; }
.ended-card { display: none; margin-top: 32px; padding: 28px 32px; border-radius: 22px; background: #1b1e36; border: 1px solid rgba(255,224,74,.4); align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; animation: bubin .5s ease forwards; }
.callscr.ended .ended-card { display: flex; }
.callscr.ended .live-dot { color: #a3a8bf; }
.callscr.ended .live-dot::before { animation: none; }
.ended-card h2 { font-size: 2.2rem; color: #fff; }

/* Report */
.rep-head { padding: clamp(40px, 6vw, 80px) 0 clamp(40px, 5vw, 64px); }
.rh-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, .6fr); gap: clamp(24px, 4vw, 56px); align-items: end; }
.rep-head h1 { font-size: clamp(2.6rem, 5.4vw, 4.6rem); line-height: 1; margin: 10px 0 18px; }
.rh-photo { aspect-ratio: 4/5; border-radius: 24px; background-size: cover; background-position: center 25%; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 18px; margin-top: 40px; }
.kpis > div { padding: 22px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); }
.kpis b { display: block; font: 400 3.2rem/1 var(--serif); }
.kpis span { color: var(--muted); font-size: .92rem; }
.ba2 { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 20px; align-items: stretch; }
.ba-col { border-radius: 20px; padding: 28px; }
.ba-col h4 { margin: 0 0 16px; font: 600 .78rem var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.ba-col p { margin: 0 0 12px; line-height: 1.55; }
.ba-col small { display: block; color: var(--muted); font-size: .78rem; margin-bottom: 2px; }
.ba-col.old { background: var(--soft); color: var(--muted); }
.ba-col.old h4 { color: var(--bad); }
.ba-col.new { background: var(--panel); border: 2px solid var(--ink); box-shadow: 8px 8px 0 var(--hi); }
.ba-col.new h4 { color: var(--good); }
.ba-col mark { background: var(--hi); padding: 0 2px; }
.ba-stat { margin-top: 18px !important; padding-top: 14px; border-top: 1px dashed var(--line); font: 600 .8rem var(--mono); }
.ba-arrow { align-self: center; font-size: 2rem; color: var(--muted); }
.tl2 { list-style: none; padding: 0; margin: 36px 0 0; position: relative; }
.tl2::before { content: ""; position: absolute; left: 52px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.tl2 li { display: grid; grid-template-columns: 52px minmax(0,1fr); gap: 28px; padding-bottom: 28px; position: relative; }
.tl2 li::after { content: ""; position: absolute; left: 47px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 3px solid var(--paper); }
.tl2 .t { font: 600 .85rem var(--mono); color: var(--muted); padding-top: 2px; }
.tl-body { display: grid; grid-template-columns: minmax(0,.85fr) minmax(0,1.15fr); gap: 16px; }
.said { margin: 0; font-size: 1.05rem; font-style: italic; color: var(--muted); line-height: 1.55; }
.wrote { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
.wrote p { margin: 8px 0 0; line-height: 1.55; }
.wrote .prev { text-decoration: line-through; color: var(--muted); font-size: .9rem; }
.wrote mark { background: var(--hi); padding: 0 2px; }
.kind { display: inline-block; padding: 2px 10px; border-radius: 999px; font: 600 .68rem var(--mono); letter-spacing: .05em; text-transform: uppercase; background: #eef0ff; color: var(--accent); }
.k-quantified, .k-impact { background: #fff5c7; color: #7a5a00; }
.k-corrected { background: #ffecec; color: var(--bad); }
.k-strength { background: #e9f7ef; color: var(--good); }
.str-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 18px; }
.str { padding: 24px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); }
.str h3 { margin: 12px 0 8px; font-size: 1.2rem; }
.tmap { margin-top: 40px; padding: 28px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); }
.tmap h3 { margin: 0 0 18px; }
.tm-row { display: grid; grid-template-columns: 160px minmax(0,1fr) 30px; gap: 14px; align-items: center; margin-bottom: 12px; }
.tm-bar { height: 12px; background: var(--soft); border-radius: 999px; overflow: hidden; }
.tm-bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.rep-final { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: clamp(28px, 5vw, 64px); align-items: start; }
.rep-final .rp { border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(20,22,42,.08); }

@media (max-width: 960px) {
  .h2-grid, .cs-grid, .rh-grid, .rep-final { grid-template-columns: 1fr; }
  .h2-bottom { padding-top: 32px; }
  .stage { min-height: 560px; }
  .how3, .feat-grid { grid-template-columns: 1fr; }
  .who-grid { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .ba2 { grid-template-columns: 1fr; }
  .ba-arrow { transform: rotate(90deg); justify-self: center; }
  .tl-body { grid-template-columns: 1fr; }
  .rh-photo { max-width: 260px; }
}
@media (max-width: 560px) {
  .bub { max-width: 80%; font-size: .9rem; }
  .b-line { bottom: 132px; }
  .st-foot { flex-direction: column; align-items: flex-start; }
  .tm-row { grid-template-columns: 110px minmax(0,1fr) 24px; }
  .tl2::before { left: 40px; } .tl2 li { grid-template-columns: 40px minmax(0,1fr); gap: 20px; } .tl2 li::after { left: 35px; }
}
@media (prefers-reduced-motion: reduce) { .bub.in, .ended-card { animation: none; opacity: 1; transform: none; } .orb, .pulse { animation: none; } }

</style>

function seeded(n) { const x = Math.sin(n * 9301 + 49297) * 233280; return x - Math.floor(x); }

const JOBS = (() => {
  const out = []; let id = 1001;
  Object.entries(HIRING).forEach(([cslug, pairs], ci) => {
    const c = COMPANIES.find(x => x.slug === cslug);
    pairs.forEach(([rslug, city], pi) => {
      ["New Grad", "Internship"].forEach((level, li) => {
        const k = ci * 31 + pi * 7 + li;
        if (seeded(k) < 0.22) return; // not every combo is open
        const r = ROLES.find(x => x.slug === rslug);
        const sr = seeded(k + 11);
        const sponsor = c.slug === "booz-allen" ? "no" : sr < 0.45 ? "yes" : sr < 0.8 ? "likely" : "unknown";
        const lo = level === "Internship" ? Math.round(r.salary[0] / 2.08) : r.salary[0];
        const hi = level === "Internship" ? Math.round(r.salary[1] / 2.08) : r.salary[1];
        const posted = 1 + Math.floor(seeded(k + 3) * 20);
        const dl = 3 + Math.floor(seeded(k + 5) * 40);
        const deadline = new Date(Date.UTC(2026, 10, 24 + dl)).toISOString().slice(0, 10);
        const year = level === "Internship" ? "Summer 2027" : "2027 Start";
        const title = level === "Internship" ? `${r.name} Intern, ${year}` : `${r.name}, New Grad ${year.replace(" Start", "")}`;
        out.push({ id: id++, company: c.slug, role: rslug, city, level, title, sponsor,
          salary: level === "Internship" ? `$${lo}–$${hi}/hr` : `$${lo}K–$${hi}K`,
          posted, deadline, model: city === "remote" ? "Remote" : seeded(k + 9) > 0.5 ? "Hybrid" : "Onsite" });
      });
    });
  });
  return out;
})();

// ---------- ROUTER ----------
const ROUTES = {};      // exact name -> fn
const PATTERNS = [];    // [regex, fn]
const route = (name, fn) => { ROUTES[name] = fn; };
const pattern = (re, fn) => PATTERNS.push([re, fn]);

function notFound(name) {
  return { title: "Page not found", path: "/404", html: pageHead({ title: "We couldn't find that page", lead: `There is no page called “${esc(name)}”.` }) + `<div class="wrap section"><a class="btn primary" href="#home">Go home</a> <a class="btn" href="#sitemap">See every page</a></div>` };
}

function resolve(name) {
  if (ROUTES[name]) return ROUTES[name]();
  for (const [re, fn] of PATTERNS) { const m = name.match(re); if (m) { const r = fn(...m.slice(1)); if (r) return r; } }
  return notFound(name);
}

let afterRender = [];
const onRender = fn => afterRender.push(fn);

function render() {
  const name = (location.hash || "#home").slice(1) || "home";
  afterRender = [];

  const page = resolve(name);
  document.title = page.seoTitle || (page.title === "Yapply" ? "AI Career Coach That Writes Your Resume Live | Yapply" : `${page.title} | Yapply`);
  const plain = s => String(s || "").replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
  const clip = t => t.length <= 160 ? t : t.slice(0, 157).replace(/\s+\S*$/, "") + "…";
  const desc = clip(plain(page.desc || (page.html.match(/class="answer">([\s\S]*?)<\/p>/) || [])[1] || (page.html.match(/class="lead"[^>]*>([\s\S]*?)<\/p>/) || [])[1]));
  $("#meta-desc").setAttribute("content", desc || "Yapply is an AI career coach you talk to. It finds strengths you missed and polishes your resume live while you talk.");
  $("#canonical").setAttribute("href", "https://yapply.ai" + (page.path || "/"));
  $("#app").innerHTML = (page.path ? urlbar(page.path, page.crumbs) : "") + page.html;
  window.scrollTo(0, 0);
  const ld = [{ "@context": "https://schema.org", "@type": "BreadcrumbList", itemListElement: (page.crumbs || [["Home"]]).map(([n], i) => ({ "@type": "ListItem", position: i + 1, name: n })) }];
  if (FAQ_LD.length) ld.push({ "@context": "https://schema.org", "@type": "FAQPage", mainEntity: FAQ_LD.slice(0, 10).map(([q, a]) => ({ "@type": "Question", name: q, acceptedAnswer: { "@type": "Answer", text: a } })) });
  if (page.ld) ld.push(page.ld);
  $("#ld").textContent = JSON.stringify(ld);
  afterRender.forEach(f => { try { f(); } catch (e) { console.error(e); } });
}

function personaReport(p) {
  const lines = {}; const log = [];
  p.steps.forEach((s, i) => { if (s.id) { log.push({ i, prev: lines[s.id], ...s }); lines[s.id] = s.html; } });
  const strengths = [...p.steps.filter(s => s.strength).map(s => [s.strength[0], s.strength[1], "“" + s.me + "”"]), ...p.extra];
  const numbers = Object.values(lines).join(" ").match(/\$?\d[\d,.]*\s?%?(K)?/g) || [];
  return { lines, log, strengths, numbers: numbers.length, questions: p.steps.filter(s => s.ai).length, corrections: log.filter(l => l.prev).length };
}
const stamp = (i, n, total) => { const [m, s] = total.split(":").map(Number); const sec = Math.round(((i + 1) / (n + 1)) * (m * 60 + s)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`; };

function resumePaper(p, lines, live) {
  return `<div class="paper rp">
    <div class="rp-top"><span class="eyebrow" style="margin:0">${live ? '<span class="rec"></span>Writing live' : "Final resume"}</span><span class="small muted">${esc(p.aim)}</span></div>
    <h3 style="margin:14px 0 0">${p.name}</h3><p class="small muted" style="margin:0 0 12px">${p.contact}</p>
    <h5>Education</h5><p class="small">${p.edu}</p>
    ${p.sections.map(([h, sub, ids]) => `<h5>${h}</h5><p class="small"><b>${sub}</b></p><ul class="small">${ids.map(id => `<li data-l="${id}">${lines[id] || '<span class="ghost">listening…</span>'}</li>`).join("")}</ul>`).join("")}
  </div>`;
}

function heroStage() {
  const keys = Object.keys(PERSONAS);
  onRender(() => {
    const root = $("#stage"); if (!root) return;
    let k = 0, timer, bub;
    const show = (i, manual) => {
      k = i; const p = PERSONAS[keys[i]];
      root.querySelectorAll(".av").forEach((b, j) => { b.setAttribute("aria-pressed", j === i); });
      root.querySelector(".st-img").style.backgroundImage = `url(${p.img()})`;
      root.querySelector(".st-who").innerHTML = `<b>${p.name}</b><span>${p.role}</span>`;
      root.querySelector(".st-call").setAttribute("href", "#call-" + keys[i]);
      root.querySelector(".st-call span").textContent = `Hear ${p.first}'s call`;
      const qs = p.steps.filter(s => s.ai), ms = p.steps.filter(s => s.me && s.id);
      let n = 0; clearInterval(bub);
      const paint = () => {
        const q = qs[n % qs.length], m = ms[n % ms.length];
        root.querySelector(".b-ai").textContent = q.ai; root.querySelector(".b-me").textContent = m.me;
        root.querySelector(".b-line").innerHTML = `<small>${m.kind} · on your resume</small>${m.html}`;
        root.querySelectorAll(".bub").forEach(b => { b.classList.remove("in"); void b.offsetWidth; b.classList.add("in"); });
        n++;
      };
      paint(); bub = setInterval(() => { if (!root.isConnected) return clearInterval(bub); paint(); }, 4200);
      if (manual) clearInterval(timer);
    };
    root.querySelectorAll(".av").forEach((b, j) => b.addEventListener("click", () => show(j, true)));
    show(0);
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) timer = setInterval(() => { if (!root.isConnected) return clearInterval(timer); show((k + 1) % keys.length); }, 12600);

pattern(/^call-([abcd])$/, k => {
  const p = PERSONAS[k], r = personaReport(p);
  onRender(() => {
    const root = $("#callscr"); if (!root) return;
    const tx = root.querySelector(".tx"), live = {}, cap = root.querySelector(".cap"), meter = root.querySelector(".cs-meter");
    let i = 0, edits = 0, t0 = Date.now(), timers = [];
    const total = (() => { const [m, s] = p.mins.split(":").map(Number); return m * 60 + s; })();
    const clock = setInterval(() => { if (!root.isConnected) return clearInterval(clock); const sec = Math.min(total, Math.round((Date.now() - t0) / 1000 * (total / (p.steps.length * 2.6)))); root.querySelector(".clk").textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`; }, 250);
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const step = () => {
      if (!root.isConnected) return;
      if (i >= p.steps.length) { clearInterval(clock); root.querySelector(".clk").textContent = p.mins; root.classList.add("ended"); return; }
      const s = p.steps[i++];
      tx.insertAdjacentHTML("beforeend", `<div class="bubble ${s.ai ? "ai" : "me"}"><small>${s.ai ? "COACH" : p.first.toUpperCase()}</small>${esc(s.ai || s.me)}</div>`); tx.scrollTop = tx.scrollHeight;
      cap.textContent = s.ai ? "Coach is asking…" : `${p.first} is talking · resume updating`;
      root.classList.toggle("talking", !!s.me);
      if (s.id) timers.push(setTimeout(() => {
        const li = root.querySelector(`[data-l="${s.id}"]`); if (!li) return;
        li.innerHTML = s.html; li.classList.remove("flash"); void li.offsetWidth; li.classList.add("flash");
        edits++; meter.innerHTML = `<b>${edits}</b> live edits · <b>${(Object.assign(live, { [s.id]: s.html }), (Object.values(live).join(" ").match(/\$?\d[\d,.]*\s?%?(K)?/g) || []).length)}</b> numbers found`;
        const chip = document.createElement("div"); chip.className = "kind-chip"; chip.textContent = s.kind; li.appendChild(chip);
      }, reduce ? 0 : 900));
      timers.push(setTimeout(step, reduce ? 50 : (s.me ? 2600 : 1700)));
    };
    timers.push(setTimeout(step, reduce ? 0 : 600));
    root.querySelector(".skip").addEventListener("click", () => { timers.forEach(clearTimeout); while (i < p.steps.length) { const s = p.steps[i++]; tx.insertAdjacentHTML("beforeend", `<div class="bubble ${s.ai ? "ai" : "me"}"><small>${s.ai ? "COACH" : p.first.toUpperCase()}</small>${esc(s.ai || s.me)}</div>`); } Object.entries(r.lines).forEach(([id, h]) => { const li = root.querySelector(`[data-l="${id}"]`); if (li) li.innerHTML = h; }); meter.innerHTML = `<b>${r.log.length}</b> live edits · <b>${r.numbers}</b> numbers found`; clearInterval(clock); root.querySelector(".clk").textContent = p.mins; root.classList.add("ended"); });
  });
  return { title: `Sample call: ${p.name}`, seoTitle: `Sample AI Career Coach Call: ${ICP[p.key].tag} | Yapply`, desc: `Hear a sample Yapply call with ${p.first} (${ICP[p.key].tag.toLowerCase()}) and watch the resume being written live as they talk.`, path: "/call/sample-" + k, crumbs: [["Home", "home"], ["Call", "call"], [p.first]],
    html: `<section class="callscr" id="callscr"><div class="wrap">
      <div class="cs-top"><div class="row" style="gap:12px"><span class="lp-img sm" style="background-image:url(${p.img()})"></span><div><b>${p.name}</b><div class="small" style="opacity:.7">${p.role} · aiming for ${p.aim}</div></div></div>
        <div class="row" style="gap:10px"><span class="live-dot">LIVE</span><span class="clk num">0:00</span><button class="btn sm ghost-d skip" type="button">Skip to end</button></div></div>
      <div class="cs-grid">
        <div class="cs-left"><div class="orb" aria-hidden="true"></div><p class="cap">Connecting…</p>
          <div class="wave" aria-hidden="true">${Array.from({ length: 32 }, (_, j) => `<i style="animation-delay:${(j * 0.06).toFixed(2)}s"></i>`).join("")}</div>
          <div class="tx" aria-live="polite"></div></div>
        <div class="cs-right"><p class="cs-meter small"><b>0</b> live edits · <b>0</b> numbers found</p>${resumePaper(p, {}, true)}</div>
      </div>
      <div class="ended-card"><div><span class="eyebrow" style="margin:0;color:#ffe04a">Call ended · ${p.mins}</span><h2 class="serif" style="margin:6px 0 4px">${p.first}'s report is ready.</h2><p style="opacity:.75;margin:0">How the resume was written live, and what the coach dug up.</p></div><a class="btn primary lg" href="#report-${k}">See the report →</a></div>
      <p class="small" style="opacity:.55;margin-top:18px">Sample call with a fictional person. In the app, you talk with your own voice.</p>
    </div></section>` };
});

function mockInterviewDemo() {
  onRender(() => {
    const qs = ["Tell me about the study-room app on your resume.", ...IQ.behavioral.qs.map(q => q[0])]; let i = 0;
    const log = $("#mi-log"), form = $("#mi-form"), inp = $("#mi-in");
    const add = (cls, t) => { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = t; log.appendChild(d); log.scrollTop = log.scrollHeight; };
    form.addEventListener("submit", e => {
      e.preventDefault(); const a = inp.value.trim(); if (!a) return; add("me", a); inp.value = "";
      const words = a.split(/\s+/).length, hasNum = /\d/.test(a), hasI = /\bI\b/.test(a);
      const fb = words < 25 ? "Let me stop you there. Walk me through what you did, step by step." : !hasNum ? "Good. What was the result, in numbers? Users, hours saved, anything." : !hasI ? "You said \"we\" a lot. What did you personally do?" : "Clear and specific. That's the version to say in the real interview.";
      setTimeout(() => { add("ai", fb); i = (i + 1) % qs.length; setTimeout(() => add("ai", "Next: " + qs[i]), 500); }, 400);
    });
  });
  return `<div class="chat" style="max-height:440px;overflow:auto" id="mi-log" aria-live="polite"><div class="msg ai">Tell me about the study-room app on your resume.</div></div>

}

const opt = (v, t, sel) => `<option value="${v}"${sel ? " selected" : ""}>${t}</option>`;

function jobBoard(preset = {}) {
  const id = "jb" + Math.random().toString(36).slice(2, 7);
  onRender(() => {
    const root = $("#" + id);
    const draw = () => {
      const f = Object.fromEntries(["q", "role", "city", "level", "sponsor"].map(k => [k, root.querySelector(`[name=${k}]`).value]));
      const list = JOBS.filter(j => (!f.role || j.role === f.role) && (!f.city || j.city === f.city) && (!f.level || j.level === f.level)
        && (!f.sponsor || (f.sponsor === "yes" ? ["yes", "likely"].includes(j.sponsor) : j.sponsor === f.sponsor))
        && (!f.q || (j.title + company(j.company).name).toLowerCase().includes(f.q.toLowerCase())))
        .sort((a, b) => a.posted - b.posted);
      root.querySelector(".count").textContent = plural(list.length, "role");
      root.querySelector(".jobs").innerHTML = list.length ? list.map(jobRow).join("") : `<p class="card">No roles match. Try removing a filter.</p>`;
    };
    root.addEventListener("input", draw); draw();
  });
  return `<div id="${id}"><form class="filters" onsubmit="return false">
    <label for="${id}q">Search<input id="${id}q" name="q" placeholder="Title or company" value=""></label>
    <label for="${id}r">Role<select id="${id}r" name="role">${opt("", "All roles")}${ROLES.map(r => opt(r.slug, r.name, preset.role === r.slug)).join("")}</select></label>
    <label for="${id}c">Location<select id="${id}c" name="city">${opt("", "All locations")}${CITIES.map(c => opt(c.slug, c.name, preset.city === c.slug)).join("")}</select></label>
    <label for="${id}l">Level<select id="${id}l" name="level">${opt("", "Intern + new grad")}${opt("New Grad", "New grad", preset.level === "New Grad")}${opt("Internship", "Internship", preset.level === "Internship")}</select></label>
    <label for="${id}s">Sponsorship<select id="${id}s" name="sponsor">${opt("", "Any")}${opt("yes", "Sponsors or likely", preset.sponsor === "yes")}${opt("unknown", "Unclear")}${opt("no", "No sponsorship")}</select></label>
    <span class="count small muted" style="margin-left:auto"></span></form><div class="jobs"></div></div>`;
}

function summarize(list) {
  const sp = list.filter(j => ["yes", "likely"].includes(j.sponsor)).length;
  const cos = new Set(list.map(j => j.company)).size;
  return { n: list.length, sp, cos };
}

    const list = JOBS.filter(j => (!preset.level || j.level === preset.level) && (!preset.city || j.city === preset.city) && (!preset.sponsor || ["yes", "likely"].includes(j.sponsor)));

function categoryPage(rslug, cslug, h1b) {
  const r = role(rslug); if (!r) return null; const c = cslug ? city(cslug) : null; if (cslug && !c) return null;
  const list = JOBS.filter(j => j.role === rslug && (!cslug || j.city === cslug) && (!h1b || ["yes", "likely"].includes(j.sponsor)));
  const s = summarize(list);
  const where = c ? ` in ${c.name}` : "";
  const title = h1b ? `H-1B sponsoring ${r.name} jobs${where}` : `${r.name} new grad jobs${where}`;
  const path = (h1b ? `/h1b-jobs/${rslug}` : `/jobs/${rslug}-new-grad`) + (cslug ? `-in-${cslug}` : "");
  const base = h1b ? `h1b-jobs-${rslug}` : `jobs-${rslug}-new-grad`;
  const months = [...new Set(list.map(j => company(j.company).opens))];
  const cityLinks = CITIES.filter(x => x.slug !== cslug && JOBS.some(j => j.role === rslug && j.city === x.slug)).map(x => `<a class="btn sm" href="#${base}-in-${x.slug}">${x.name}</a>`).join("");
  const roleLinks = ROLES.filter(x => x.slug !== rslug).slice(0, 6).map(x => `<a class="btn sm" href="#${h1b ? "h1b-jobs-" : "jobs-"}${x.slug}${h1b ? "" : "-new-grad"}${cslug ? "-in-" + cslug : ""}">${x.name}</a>`).join("");
  return { title, path, crumbs: [["Home", "home"], [h1b ? "H1B jobs" : "Jobs", h1b ? "h1b-jobs" : "jobs"], [title]],
    html: pageHead({ eyebrow: h1b ? "H1B jobs" : "New grad jobs", title,
      answer: `As of ${AS_OF}, Yapply lists <b>${s.n}</b> ${r.name} roles${where} at <b>${s.cos}</b> companies${h1b ? "" : `; <b>${s.sp}</b> sponsor or are likely to sponsor H-1B`}. Typical new grad base salary: <b>$${r.salary[0]}K–$${r.salary[1]}K</b>.`, extra: `<p style="margin-top:12px">${DEMO}</p>` }) + `
    <section class="section"><div class="wrap layout-side"><div>${jobBoard({ role: rslug, city: cslug || "", sponsor: h1b ? "yes" : "" })}</div>
      <aside class="stack"><div class="card"><h4>When these roles open</h4><p class="small">${months.length ? `Employers here usually open applications in <b>${months.join(", ")}</b>.` : "No pattern yet."}</p><a class="small" href="#guide-new-grad-recruiting-timeline">Recruiting timeline</a></div>

      <div class="card"><h4>If you're an international student</h4><p class="small">Apply to sponsoring employers first and confirm sponsorship with the recruiter early.</p><a class="small" href="#guide-h1b-for-new-grads">H-1B guide</a></div></aside></div></section>
    <section class="section"><div class="wrap stack"><h2>Nearby searches</h2>${cityLinks ? `<div class="row">${cityLinks}</div>` : ""}<div class="row">${roleLinks}</div></div></section>
    <section class="section"><div class="wrap"><h2>FAQ</h2>${faqBlock([[`When should I apply for ${r.name} new grad roles?`, `Within the first 1–3 weeks a role opens. ${months.length ? `Here, most open in ${months.join(", ")}.` : ""}`], [`Do ${r.name} new grad roles sponsor H-1B?`, `${s.sp} of ${s.n} listed roles${where} are at employers that sponsor or are likely to.`], ["How do I stand out?", `Use numbers in every bullet and mirror the job's keywords. Try the <a href="#tool-ats-resume-checker">ATS resume checker</a>.`]])}</div></section>
    ${ctaBand(`Get a ${r.name} resume tailored to each of these roles.`)}` };
}

const gTerm = slug => GLOSSARY.find(x => x.slug === slug);
route("glossary", () => {
  const sorted = [...GLOSSARY].sort((a, b) => a.term.localeCompare(b.term));
  const letters = [...new Set(sorted.map(g => g.term[0].toUpperCase()))];
  onRender(() => {
    const draw = () => { const q = $("#gl-q").value.toLowerCase().trim(), c = document.querySelector(".chip.on")?.dataset.t || ""; let n = 0;
      document.querySelectorAll(".gl-card").forEach(el => { const ok = (!q || el.textContent.toLowerCase().includes(q)) && (!c || el.dataset.cat === c); el.classList.toggle("hidden", !ok); if (ok) n++; });
      document.querySelectorAll(".gl-letter").forEach(sec => sec.classList.toggle("hidden", !sec.querySelector(".gl-card:not(.hidden)")));
      $("#gl-n").textContent = `Showing ${n} of ${GLOSSARY.length} terms`; };
    $("#gl-q").addEventListener("input", draw);
    document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { const was = b.classList.contains("on"); document.querySelectorAll(".chip").forEach(x => x.classList.remove("on")); if (!was) b.classList.add("on"); draw(); }));
    document.querySelectorAll("[data-letter]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); document.getElementById("letter-" + a.dataset.letter).scrollIntoView({ behavior: "smooth" }); }));
    draw();
  });
  return { title: "Job search glossary", path: "/glossary", crumbs: [["Home", "home"], ["Glossary"]],
    html: pageHead({ eyebrow: "Resources", title: "Job search glossary", lead: `Plain-English definitions for ${GLOSSARY.length} resume, interview, recruiting, offer and work-visa terms every new grad runs into.` }) + `
    <section class="section" style="padding-top:24px"><div class="wrap">
      <div class="row"><label for="gl-q" class="hidden">Search terms</label><input id="gl-q" placeholder="Search terms, e.g. OPT, ATS, magna cum laude" style="flex:1;min-width:240px"><span id="gl-n" class="small muted"></span></div>
      <div class="row" style="gap:8px;margin:14px 0">${GLOSSARY_CATS.map(c => `<button class="chip" type="button" data-t="${c}">${c}</button>`).join("")}</div>
      <nav class="az" aria-label="Jump to letter">${"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(l => letters.includes(l) ? `<a href="#glossary" data-letter="${l}">${l}</a>` : `<span>${l}</span>`).join("")}</nav>
      ${letters.map(l => `<div class="gl-letter" id="letter-${l}"><h2>${l}</h2><div class="grid">${sorted.filter(g => g.term[0].toUpperCase() === l).map(g => `<div class="card gl-card" data-cat="${g.cat}"><h3><a href="#glossary-${g.slug}" style="color:inherit">${g.term}</a></h3><p class="small">${(g.def.match(/^.*?[.!?](?=\s|$)/) || [g.def])[0]}</p><a class="small" href="#glossary" onclick="event.preventDefault();document.querySelector('.chip[data-t=&quot;${g.cat}&quot;]').click()">${g.cat}</a></div>`).join("")}</div></div>`).join("")}
    </div></section>${ctaBand("Know the words. Now say them about yourself.", "Talk for 10 minutes and Yapply writes your resume while you speak.")}` };
});
