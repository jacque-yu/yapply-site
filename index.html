<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yapply</title>
<meta name="description" content="Yapply is a voice-first AI career agent for US new grads and interns. Talk for 10 minutes, get a resume built from your real story, matched jobs and one-click applications.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a newsroom-style job desk. Ink-on-paper base, one highlighter yellow that marks
   the words Yapply "heard" in your story; cobalt for anything you can click. */
:root {
  --paper: #f4f5f0;
  --panel: #ffffff;
  --ink: #14162a;
  --muted: #5a5f74;
  --line: #dddfd6;
  --accent: #2b37d4;
  --accent-ink: #ffffff;
  --hi: #ffe04a;
  --hi-ink: #14162a;
  --good: #17825a;
  --warn: #b36b00;
  --bad: #b3362f;
  --soft: #eceee6;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  --wrap: 1160px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1120; --panel: #171a2c; --ink: #eceef6; --muted: #a3a8bf; --line: #2a2e46;
    --accent: #9aa2ff; --accent-ink: #0f1120; --hi: #f2cd2c; --hi-ink: #14162a;
    --good: #48c58d; --warn: #e0a243; --bad: #f07b72; --soft: #1d2136; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1120; --panel: #171a2c; --ink: #eceef6; --muted: #a3a8bf; --line: #2a2e46;
  --accent: #9aa2ff; --accent-ink: #0f1120; --hi: #f2cd2c; --hi-ink: #14162a;
  --good: #48c58d; --warn: #e0a243; --bad: #f07b72; --soft: #1d2136; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
img, svg { max-width: 100%; }
a { color: var(--accent); text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.1; text-wrap: balance; margin: 0 0 .5em; letter-spacing: -0.02em; }
h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); font-weight: 800; }
h2 { font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 750; }
h3 { font-size: 1.25rem; font-weight: 700; }
h4 { font-size: 1.02rem; font-weight: 700; letter-spacing: 0; }
p { margin: 0 0 1em; }
.prose { max-width: 68ch; }
.prose h2 { margin-top: 1.6em; }
.prose h3 { margin-top: 1.3em; }
.prose li { margin-bottom: .35em; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.mono { font-family: var(--mono); font-size: .85em; }
.num { font-variant-numeric: tabular-nums; }
mark, .mark { background: linear-gradient(transparent 12%, var(--hi) 12%, var(--hi) 88%, transparent 88%); color: var(--hi-ink); padding: 0 .15em; border-radius: 2px; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px); }
.section { padding: clamp(40px, 6vw, 72px) 0; }
.section + .section { border-top: 1px solid var(--line); }
.stack { display: grid; gap: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.grid-2 { display: grid; gap: 28px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); align-items: start; }
.eyebrow { font-family: var(--mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; display: block; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--ink); background: var(--panel); color: var(--ink); padding: 10px 18px; border-radius: 999px; font: 600 .95rem var(--body); cursor: pointer; text-decoration: none; transition: transform .12s ease, background .12s ease; }
.btn:hover { transform: translateY(-1px); }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: var(--line); }
.btn.sm { padding: 6px 12px; font-size: .85rem; }

/* header */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 22px; height: 64px; }
.logo { font: 800 1.45rem var(--display); color: var(--ink); text-decoration: none; letter-spacing: -0.04em; display: flex; align-items: center; gap: 8px; }
.logo .dot { width: 22px; height: 22px; border-radius: 6px; background: var(--hi); display: grid; place-items: center; }
.logo .dot i { display: block; width: 3px; border-radius: 2px; background: var(--hi-ink); margin: 0 1px; }
.nav { display: flex; gap: 4px; align-items: center; margin-left: 8px; }
.nav > * { position: relative; }
.nav a.nl, .nav button.nl { background: none; border: 0; font: 600 .95rem var(--body); color: var(--ink); padding: 8px 12px; border-radius: 8px; cursor: pointer; text-decoration: none; }
.nav a.nl:hover, .nav button.nl:hover, .nav .open > button.nl { background: var(--soft); }
.dd { position: absolute; top: calc(100% + 8px); left: 0; min-width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; box-shadow: 0 18px 40px rgba(10, 12, 30, .12); display: none; }
.open > .dd { display: grid; gap: 2px; }
.dd a { display: block; padding: 9px 12px; border-radius: 8px; color: var(--ink); text-decoration: none; }
.dd a:hover { background: var(--soft); }
.dd a b { display: block; font-weight: 700; font-size: .93rem; }
.dd a span { font-size: .82rem; color: var(--muted); }
.top .spacer { flex: 1; }
.menu-btn { display: none; }
@media (max-width: 880px) {
  .nav { display: none; position: absolute; top: 64px; left: 0; right: 0; background: var(--panel); flex-direction: column; align-items: stretch; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .nav.show { display: flex; }
  .dd { position: static; box-shadow: none; border: 0; padding: 0 0 0 12px; min-width: 0; }
  .menu-btn { display: inline-flex; }
  .top .login { display: none; }
}

/* url chip that maps prototype routes to production URLs */
.urlbar { font-family: var(--mono); font-size: .78rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 14px 0 0; }
.urlbar .path { background: var(--soft); border: 1px solid var(--line); padding: 2px 8px; border-radius: 6px; color: var(--ink); }
.crumbs { font-size: .85rem; color: var(--muted); }
.crumbs a { color: var(--muted); }

/* page head */
.phead { padding: 28px 0 32px; border-bottom: 1px solid var(--line); }
.phead p.lead { font-size: 1.15rem; color: var(--muted); max-width: 62ch; }
.answer { border-left: 4px solid var(--hi); background: var(--panel); padding: 14px 18px; border-radius: 0 var(--r) var(--r) 0; max-width: 72ch; }

/* cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.card h3 { margin-bottom: .35em; }
a.card { color: inherit; text-decoration: none; display: block; transition: border-color .15s ease, transform .15s ease; }
a.card:hover { border-color: var(--ink); transform: translateY(-2px); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: .75rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); white-space: nowrap; }
.tag.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 35%, transparent); background: color-mix(in srgb, var(--good) 10%, transparent); }
.tag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.tag.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.tag.hi { background: var(--hi); color: var(--hi-ink); border-color: transparent; }
.demo-note { display: inline-flex; gap: 6px; align-items: center; font-size: .78rem; color: var(--warn); border: 1px dashed color-mix(in srgb, var(--warn) 50%, transparent); padding: 3px 10px; border-radius: 999px; }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--soft); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

/* job list */
.jobs { display: grid; gap: 10px; }
.job { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.job:hover { border-color: var(--ink); }
.job .logo-sq { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font: 800 1rem var(--display); color: #fff; }
.job h4 { margin: 0; }
.job h4 a { color: var(--ink); text-decoration: none; }
.job h4 a:hover { text-decoration: underline; }
.job .meta { font-size: .85rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.job .side { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
@media (max-width: 600px) { .job { grid-template-columns: 44px 1fr; } .job .side { grid-column: 1 / -1; flex-direction: row; align-items: center; } }

/* filters & forms */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; }
label { font-size: .82rem; font-weight: 600; display: grid; gap: 5px; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 9px; padding: 9px 11px; min-width: 0; }
textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
.form { display: grid; gap: 14px; }
.form .two { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.out { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; white-space: pre-wrap; }

/* stats */
.stats { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.stat b { display: block; font: 800 1.9rem var(--display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.stat span { font-size: .83rem; color: var(--muted); }

/* hero voice demo */
.hero { padding: clamp(36px, 6vw, 80px) 0 clamp(40px, 6vw, 72px); }
.hero h1 { font-size: clamp(2.6rem, 6.4vw, 5rem); line-height: 1; }
.hero .grid-2 { align-items: center; }
.call { background: var(--ink); color: var(--paper); border-radius: 22px; padding: 22px; box-shadow: 0 30px 60px rgba(10, 12, 30, .22); }
:root[data-theme="dark"] .call { background: #1f2340; color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .call { background: #1f2340; color: var(--ink); } }
.call .bar { display: flex; justify-content: space-between; align-items: center; font: 600 .8rem var(--mono); opacity: .75; }
.wave { display: flex; gap: 3px; align-items: center; height: 46px; margin: 14px 0; }
.wave i { flex: 1; background: var(--hi); border-radius: 3px; height: 30%; animation: wv 1.2s ease-in-out infinite; }
@keyframes wv { 0%, 100% { height: 18%; } 50% { height: 92%; } }
@media (prefers-reduced-motion: reduce) { .wave i { animation: none; height: 50%; } * { transition: none !important; } }
.bubble { padding: 10px 14px; border-radius: 14px; margin: 8px 0; font-size: .95rem; max-width: 92%; }
.bubble.ai { background: rgba(255, 255, 255, .1); }
.bubble.me { background: rgba(255, 255, 255, .18); margin-left: auto; }
.bubble small { display: block; font: 600 .7rem var(--mono); opacity: .6; margin-bottom: 2px; letter-spacing: .05em; }
.resume-line { background: var(--panel); color: var(--ink); border-radius: 12px; padding: 12px 14px; margin-top: 12px; font-size: .9rem; border-left: 4px solid var(--hi); }

/* steps */
.steps { counter-reset: s; display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.step { position: relative; padding-top: 44px; }
.step::before { counter-increment: s; content: counter(s, decimal-leading-zero); position: absolute; top: 0; left: 0; font: 800 1.9rem var(--display); color: var(--accent); }

/* accordion */
details { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px; margin-bottom: 10px; }
summary { cursor: pointer; font-weight: 700; padding: 12px 0; }
details[open] summary { border-bottom: 1px solid var(--line); margin-bottom: 10px; }

/* chat demo */
.chat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; }
.chat .msg { padding: 10px 14px; border-radius: 12px; max-width: 88%; }
.chat .msg.ai { background: var(--soft); }
.chat .msg.me { background: var(--accent); color: var(--accent-ink); margin-left: auto; }

/* pricing */
.plans { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); }
.plan { background: var(--panel); border: 1.5px solid var(--line); border-radius: 18px; padding: 24px; display: grid; gap: 12px; align-content: start; }
.plan.featured { border-color: var(--ink); box-shadow: 8px 8px 0 var(--hi); }
.plan .price { font: 800 2.6rem var(--display); letter-spacing: -0.04em; }
.plan ul { margin: 0; padding-left: 18px; }

/* footer */
footer.site { border-top: 1px solid var(--line); margin-top: 40px; padding: 48px 0 28px; background: var(--panel); }
.fgrid { display: grid; gap: 28px; grid-template-columns: 1.3fr repeat(5, 1fr); }
.fgrid h5 { font: 700 .8rem var(--mono); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 12px; color: var(--muted); }
.fgrid ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; font-size: .9rem; }
.fgrid a { color: var(--ink); text-decoration: none; }
.fgrid a:hover { text-decoration: underline; }
.fbottom { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); font-size: .82rem; color: var(--muted); }
@media (max-width: 980px) { .fgrid { grid-template-columns: repeat(3, 1fr); } .fgrid .fbrand { grid-column: 1 / -1; } }
@media (max-width: 560px) { .fgrid { grid-template-columns: repeat(2, 1fr); } }

.cta-band { background: var(--ink); color: var(--paper); border-radius: 22px; padding: clamp(28px, 5vw, 48px); display: grid; gap: 14px; }
.cta-band h2 { color: var(--paper); }
:root[data-theme="dark"] .cta-band { background: #1f2340; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cta-band { background: #1f2340; } }
.cta-band .btn { border-color: var(--hi); background: var(--hi); color: var(--hi-ink); justify-self: start; }

.toc { position: sticky; top: 84px; font-size: .9rem; }
.toc a { display: block; padding: 4px 0; color: var(--muted); text-decoration: none; }
.toc a:hover { color: var(--ink); }
.layout-side { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 40px; }
@media (max-width: 900px) { .layout-side { grid-template-columns: 1fr; } .toc { position: static; } }

.meter { height: 12px; border-radius: 99px; background: var(--soft); overflow: hidden; border: 1px solid var(--line); }
.meter i { display: block; height: 100%; background: var(--accent); }
.bars { display: grid; gap: 8px; }
.bars .b { display: grid; grid-template-columns: 160px 1fr 48px; gap: 10px; align-items: center; font-size: .88rem; }
.bars .b .t { height: 14px; background: var(--soft); border-radius: 4px; overflow: hidden; }
.bars .b .t i { display: block; height: 100%; background: var(--muted); }
.bars .b.on .t i { background: var(--accent); }
.kbd { font-family: var(--mono); font-size: .8rem; background: var(--soft); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-size: .9rem; z-index: 50; }
.hidden { display: none !important; }

</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#home" aria-label="Yapply home"><span class="dot" aria-hidden="true"><i style="height:8px"></i><i style="height:13px"></i><i style="height:6px"></i></span>yapply</a>
    <nav class="nav" id="nav" aria-label="Primary"></nav>
    <span class="spacer"></span>
    <a class="btn ghost sm login" href="#signup">Log in</a>
    <a class="btn accent sm" href="#signup">Join now</a>
    <button class="btn ghost sm menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav">Menu</button>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<footer class="site">
  <div class="wrap" id="footer"></div>
</footer>
<script>
// ---------- DEMO DATA ----------

const COMPANIES = [

  { slug: "brightline-capital", name: "Brightline Capital", industry: "Quantitative trading", hq: "New York, NY", size: "650 employees", color: "#0f766e", h1b: [22, 29, 31], ng: 0.52, opens: "Jul", closes: "Sep", about: "Systematic trading firm running market-making strategies across equities and options.", interview: ["Probability and mental math test", "Two technical interviews (stats, coding)", "Superday: 4 back-to-back interviews"] },

  { slug: "juniper-cloud", name: "Juniper Cloud", industry: "Cloud software", hq: "Seattle, WA", size: "3,400 employees", color: "#1d4ed8", h1b: [88, 102, 117], ng: 0.29, opens: "Aug", closes: "Dec", about: "Developer platform for deploying and observing cloud applications.", interview: ["Online assessment", "Two 45-minute coding interviews", "Behavioral interview on ownership and teamwork"] },

function seeded(n) { const x = Math.sin(n * 9301 + 49297) * 233280; return x - Math.floor(x); }

const JOBS = (() => {
  const out = []; let id = 1001;
  Object.entries(HIRING).forEach(([cslug, pairs], ci) => {
    const c = COMPANIES.find(x => x.slug === cslug);
    pairs.forEach(([rslug, city], pi) => {
      ["New Grad", "Internship"].forEach((level, li) => {
        const k = ci * 31 + pi * 7 + li;
        if (seeded(k) < 0.22) return; // not every combo is open
        const r = ROLES.find(x => x.slug === rslug);
        const total = c.h1b.reduce((a, b) => a + b, 0);
        const sponsor = c.slug === "orbit-aerospace" ? "no" : total > 40 ? "yes" : total > 12 ? "likely" : "unknown";
        const lo = level === "Internship" ? Math.round(r.salary[0] / 2.08) : r.salary[0];
        const hi = level === "Internship" ? Math.round(r.salary[1] / 2.08) : r.salary[1];
        const posted = 1 + Math.floor(seeded(k + 3) * 20);
        const dl = 3 + Math.floor(seeded(k + 5) * 40);
        const deadline = new Date(Date.UTC(2026, 10, 24 + dl)).toISOString().slice(0, 10);
        const year = level === "Internship" ? "Summer 2027" : "2027 Start";
        const title = level === "Internship" ? `${r.name} Intern, ${year}` : `${r.name}, New Grad ${year.replace(" Start", "")}`;
        out.push({ id: id++, company: c.slug, role: rslug, city, level, title, sponsor,
          salary: level === "Internship" ? `$${lo}–$${hi}/hr` : `$${lo}K–$${hi}K`,
          posted, deadline, model: city === "remote" ? "Remote" : seeded(k + 9) > 0.5 ? "Hybrid" : "Onsite" });
      });
    });
  });
  return out;
})();

// ---------- ROUTER ----------
const ROUTES = {};      // exact name -> fn
const PATTERNS = [];    // [regex, fn]
const route = (name, fn) => { ROUTES[name] = fn; };
const pattern = (re, fn) => PATTERNS.push([re, fn]);

function notFound(name) {
  return { title: "Page not found", path: "/404", html: pageHead({ title: "We couldn't find that page", lead: `There is no page called “${esc(name)}”.` }) + `<div class="wrap section"><a class="btn primary" href="#home">Go home</a> <a class="btn" href="#sitemap">See every page</a></div>` };
}

function resolve(name) {
  if (ROUTES[name]) return ROUTES[name]();
  for (const [re, fn] of PATTERNS) { const m = name.match(re); if (m) { const r = fn(...m.slice(1)); if (r) return r; } }
  return notFound(name);
}

let afterRender = [];
const onRender = fn => afterRender.push(fn);

function render() {
  const name = (location.hash || "#home").slice(1) || "home";
  afterRender = [];
  const page = resolve(name);
  document.title = page.title === "Yapply" ? "Yapply — talk for 10 minutes, get hired" : `${page.title} | Yapply`;
  $("#app").innerHTML = (page.path ? urlbar(page.path, page.crumbs) : "") + page.html;
  window.scrollTo(0, 0);
  afterRender.forEach(f => { try { f(); } catch (e) { console.error(e); } });
}

// ATS checker
const STOP = new Set("a an the and or of to in for on with at by from as is are be will you your our we this that it its their they them who what when where how able ability strong excellent including include work working team teams role job using use experience years year plus preferred required requirements responsibilities about across new grad within into per more other such than well".split(" "));
function keywords(text) {
  const words = text.toLowerCase().replace(/[^a-z0-9+#./ -]/g, " ").split(/\s+/).map(w => w.replace(/^[./-]+|[./-]+$/g, "")).filter(w => w.length > 1 && !STOP.has(w) && !/^\d+$/.test(w));
  const freq = {}; words.forEach(w => freq[w] = (freq[w] || 0) + 1);
  return Object.entries(freq).sort((a, b) => b[1] - a[1]).map(x => x[0]);
}
const EX_JD = "We are hiring a Data Analyst, New Grad to join our analytics team. You will write SQL to analyze product data, build dashboards in Tableau, run A/B test analysis and present findings to stakeholders. Requirements: SQL, Python (pandas), Excel, Tableau, statistics, A/B testing, data cleaning, communication.";

  onRender(() => {
    const run = () => {
      const jd = $("#ats-jd").value, cv = $("#ats-cv").value; const cvl = cv.toLowerCase();
      const kws = keywords(jd).slice(0, 25); const hit = kws.filter(k => cvl.includes(k)); const miss = kws.filter(k => !cvl.includes(k));
      const score = kws.length ? Math.round(hit.length / kws.length * 100) : 0;
      const wc = cv.split(/\s+/).filter(Boolean).length, nums = (cv.match(/\d[\d,.%$K]*/g) || []).length;
      const secs = ["experience", "education", "skills", "projects"].filter(s => cvl.includes(s));

      $("#ats-out").innerHTML = `<div class="stats"><div class="stat"><b>${score}%</b><span>keyword match (${hit.length} of ${kws.length})</span></div></div>
        <div class="meter" style="margin:14px 0"><i style="width:${score}%"></i></div>
        <h4>Missing keywords</h4><div class="row">${miss.map(m => `<span class="tag warn">${esc(m)}</span>`).join("") || "<span class='tag good'>None</span>"}</div>

function mockInterviewDemo() {
  onRender(() => {
    const qs = IQ.behavioral.qs.map(q => q[0]); let i = 0;
    const log = $("#mi-log"), form = $("#mi-form"), inp = $("#mi-in");
    const add = (cls, t) => { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = t; log.appendChild(d); log.scrollTop = log.scrollHeight; };
    form.addEventListener("submit", e => {
      e.preventDefault(); const a = inp.value.trim(); if (!a) return; add("me", a); inp.value = "";
      const words = a.split(/\s+/).length, hasNum = /\d/.test(a), hasI = /\bI\b/.test(a);
      let fb = words < 25 ? "That's short. Can you walk me through what you did step by step?" : !hasNum ? "Good story. What was the result, in numbers? Users, hours saved, a grade, anything." : !hasI ? "You said \"we\" a lot. What did you personally do?" : "Clear and specific. Interviewers like that you quantified the result.";
      setTimeout(() => { add("ai", fb); i = (i + 1) % qs.length; setTimeout(() => add("ai", "Next question: " + qs[i]), 500); }, 400);
    });
  });
  return `<div class="chat" style="max-height:440px;overflow:auto" id="mi-log" aria-live="polite"><div class="msg ai">${esc(IQ.behavioral.qs[0][0])}</div></div>
  <form id="mi-form" class="row" style="margin-top:10px"><label for="mi-in" class="hidden">Your answer</label><input id="mi-in" style="flex:1" placeholder="Type your answer (the real product listens by voice)"><button class="btn primary">Answer</button></form>
  <p class="small muted">Demo of the follow-up logic. In the product this is a live voice conversation.</p>`;
}

function jobBoard(preset = {}) {
  const id = "jb" + Math.random().toString(36).slice(2, 7);
  onRender(() => {
    const root = $("#" + id);
    const draw = () => {
      const f = Object.fromEntries(["q", "role", "city", "level", "sponsor"].map(k => [k, root.querySelector(`[name=${k}]`).value]));
      const list = JOBS.filter(j => (!f.role || j.role === f.role) && (!f.city || j.city === f.city) && (!f.level || j.level === f.level)
        && (!f.sponsor || (f.sponsor === "yes" ? ["yes", "likely"].includes(j.sponsor) : j.sponsor === f.sponsor))
        && (!f.q || (j.title + company(j.company).name).toLowerCase().includes(f.q.toLowerCase())))
        .sort((a, b) => a.posted - b.posted);
      root.querySelector(".count").textContent = plural(list.length, "role");
      root.querySelector(".jobs").innerHTML = list.length ? list.map(jobRow).join("") : `<p class="card">No roles match. Try removing a filter.</p>`;
    };
    root.addEventListener("input", draw); draw();
  });
  return `<div id="${id}"><form class="filters" onsubmit="return false">
    <label for="${id}q">Search<input id="${id}q" name="q" placeholder="Title or company" value=""></label>
    <label for="${id}r">Role<select id="${id}r" name="role">${opt("", "All roles")}${ROLES.map(r => opt(r.slug, r.name, preset.role === r.slug)).join("")}</select></label>

function summarize(list) {
  const sp = list.filter(j => ["yes", "likely"].includes(j.sponsor)).length;
  const cos = new Set(list.map(j => j.company)).size;
  return { n: list.length, sp, cos };
}

function categoryPage(rslug, cslug, h1b) {
  const r = role(rslug); if (!r) return null; const c = cslug ? city(cslug) : null; if (cslug && !c) return null;
  const list = JOBS.filter(j => j.role === rslug && (!cslug || j.city === cslug) && (!h1b || ["yes", "likely"].includes(j.sponsor)));
  const s = summarize(list);
  const where = c ? ` in ${c.name}` : "";
  const title = h1b ? `H-1B sponsoring ${r.name} jobs${where}` : `${r.name} new grad jobs${where}`;
  const path = (h1b ? `/h1b-jobs/${rslug}` : `/jobs/${rslug}-new-grad`) + (cslug ? `-in-${cslug}` : "");
  const base = h1b ? `h1b-jobs-${rslug}` : `jobs-${rslug}-new-grad`;
  const months = [...new Set(list.map(j => company(j.company).opens))];
  const cityLinks = CITIES.filter(x => x.slug !== cslug && JOBS.some(j => j.role === rslug && j.city === x.slug)).map(x => `<a class="btn sm" href="#${base}-in-${x.slug}">${x.name}</a>`).join("");
  const roleLinks = ROLES.filter(x => x.slug !== rslug).slice(0, 6).map(x => `<a class="btn sm" href="#${h1b ? "h1b-jobs-" : "jobs-"}${x.slug}${h1b ? "" : "-new-grad"}${cslug ? "-in-" + cslug : ""}">${x.name}</a>`).join("");
  return { title, path, crumbs: [["Home", "home"], [h1b ? "H1B jobs" : "Jobs", h1b ? "h1b-jobs" : "jobs"], [title]],
    html: pageHead({ eyebrow: h1b ? "H1B jobs" : "New grad jobs", title,
      answer: `As of ${AS_OF}, Yapply lists <b>${s.n}</b> ${r.name} roles${where} at <b>${s.cos}</b> companies${h1b ? "" : `; <b>${s.sp}</b> sponsor or are likely to sponsor H-1B`}. Typical new grad base salary: <b>$${r.salary[0]}K–$${r.salary[1]}K</b>.`, extra: `<p style="margin-top:12px">${DEMO}</p>` }) + `
    <section class="section"><div class="wrap layout-side"><div>${jobBoard({ role: rslug, city: cslug || "", sponsor: h1b ? "yes" : "" })}</div>
      <aside class="stack"><div class="card"><h4>When these roles open</h4><p class="small">${months.length ? `Employers here usually open applications in <b>${months.join(", ")}</b>.` : "No pattern yet."}</p><a class="small" href="#guide-new-grad-recruiting-timeline">Recruiting timeline</a></div>
      <div class="card"><h4>Skills to show</h4><p class="small">${(SKILLS[rslug] || SKILLS["software-engineer"]).hard.slice(0, 5).join(", ")}</p><a class="small" href="#tool-resume-skills-${rslug}">Full ${r.name} skills list</a></div>
      <div class="card"><h4>If you're an international student</h4><p class="small">Apply to sponsoring employers first and confirm sponsorship with the recruiter early.</p><a class="small" href="#guide-h1b-for-new-grads">H-1B guide</a></div></aside></div></section>
    <section class="section"><div class="wrap stack"><h2>Nearby searches</h2>${cityLinks ? `<div class="row">${cityLinks}</div>` : ""}<div class="row">${roleLinks}</div></div></section>
    <section class="section"><div class="wrap"><h2>FAQ</h2>${faqBlock([[`When should I apply for ${r.name} new grad roles?`, `Within the first 1–3 weeks a role opens. ${months.length ? `Here, most open in ${months.join(", ")}.` : ""}`], [`Do ${r.name} new grad roles sponsor H-1B?`, `${s.sp} of ${s.n} listed roles${where} are at employers that sponsor or are likely to.`], ["How do I stand out?", `Use numbers in every bullet and mirror the job's keywords. Try the <a href="#tool-ats-resume-checker">ATS resume checker</a>.`]])}</div></section>
    ${ctaBand(`Get a ${r.name} resume tailored to each of these roles.`)}` };
}

function companyPage(slug, tab) {
  const c = company(slug); if (!c) return null;
  const list = JOBS.filter(j => j.company === slug);
  const total = c.h1b.reduce((a, b) => a + b, 0);
  const tabs = [["", "Overview"], ["new-grad", "New grad"], ["internships", "Internships"], ["interview", "Interview"]];
  const tabNav = `<div class="row" role="tablist" style="margin-top:18px">${tabs.map(([t, l]) => `<a class="btn sm ${t === (tab || "") ? "primary" : ""}" href="#company-${slug}${t ? "-" + t : ""}">${l}</a>`).join("")}</div>`;
  const shown = tab === "new-grad" ? list.filter(j => j.level === "New Grad") : tab === "internships" ? list.filter(j => j.level === "Internship") : list;
  const ttl = tab === "interview" ? `${c.name} interview questions and process` : tab === "internships" ? `${c.name} internships` : tab === "new-grad" ? `${c.name} new grad jobs` : `${c.name} careers for new grads and interns`;
  const body = tab === "interview"
    ? `<section class="section"><div class="wrap grid-2"><div><h2>Interview process</h2><ol class="prose">${c.interview.map(x => `<li>${x}</li>`).join("")}</ol><h2>Questions to prepare</h2>${faqBlock(IQ.behavioral.qs.slice(0, 4).map(([q, a]) => [q, a]))}</div><div class="card"><h3>Practice ${c.name} questions out loud</h3><p class="muted">Yapply's mock interviewer asks these questions and follows up on your answers.</p><a class="btn primary" href="#feature-ai-mock-interview">Practice by voice</a></div></div></section>`
    : `<section class="section"><div class="wrap layout-side"><div><h2>${plural(shown.length, "open role")}</h2><div class="jobs" style="margin-top:12px">${shown.map(jobRow).join("") || `<p class="card">No open roles right now. ${c.name} usually opens in ${c.opens}.</p>`}</div></div>
      <aside class="stack"><div class="card"><h4>Hiring calendar</h4><p class="small">Usually opens <b>${c.opens}</b>, mostly closed by <b>${c.closes}</b>.</p></div>
      <div class="card"><h4>H-1B sponsorship</h4><p class="small num">Filings 2024 / 2025 / 2026: <b>${c.h1b.join(" / ")}</b><br>Share for new grad roles: <b>${Math.round(c.ng * 100)}%</b></p>${sponsorTag(c.slug === "orbit-aerospace" ? "no" : total > 40 ? "yes" : total > 12 ? "likely" : "unknown")}</div>
      <div class="card"><h4>About</h4><p class="small">${c.about}</p><p class="small muted">${c.industry} · ${c.hq} · ${c.size}</p></div></aside></div></section>`;
  return { title: ttl, path: `/companies/${slug}${tab ? "/" + tab : ""}`, crumbs: [["Home", "home"], ["Companies", "companies"], [c.name, tab ? "company-" + slug : null], ...(tab ? [[tabs.find(t => t[0] === tab)[1]]] : [])],
    html: pageHead({ eyebrow: c.industry, title: ttl, answer: `${c.name} has <b>${plural(list.length, "open entry-level role")}</b> on Yapply as of ${AS_OF}. It usually opens new grad hiring in ${c.opens} and has filed <b>${total}</b> H-1B petitions over the last 3 years.`, extra: `<p style="margin-top:12px">${DEMO}</p>${tabNav}` }) + body + ctaBand(`Apply to ${c.name} with a resume tailored to the role.`) };
}

  <h2 style="margin-top:36px">By company</h2><div class="row" style="margin-top:12px">${COMPANIES.map(c => `<a class="btn sm" href="#company-${c.slug}-interview">${c.name}</a>`).join("")}</div><p style="margin-top:10px">${DEMO}</p></div></section>` }));
pattern(/^interview-questions-([a-z-]+)$/, s => { const v = IQ[s]; if (!v) return null;
  return { title: `${v.name} interview questions`, path: "/interview-questions/" + s, crumbs: resCrumbs("Interview questions", "interview-questions", v.name),
    html: pageHead({ eyebrow: "Interview questions", title: `${v.name} interview questions and how to answer`, answer: `The ${v.qs.length} ${v.name.toLowerCase()} questions below come up most often for entry-level candidates. Each has a short framework; practice them out loud before your interview.` }) + `
    <section class="section"><div class="wrap grid-2"><div>${faqBlock(v.qs)}</div><div class="card"><h3>Practice these out loud</h3><p class="muted">Yapply's voice interviewer asks these questions, follows up on vague answers and gives feedback on structure and specifics.</p><a class="btn primary" href="#feature-ai-mock-interview">Start a mock interview</a></div></div></section>${ctaBand()}` }; });

route("reports", () => ({ title: "Reports", path: "/reports", crumbs: [["Home", "home"], ["Reports"]],
  html: pageHead({ eyebrow: "Resources", title: "New grad hiring reports", lead: "A monthly snapshot of entry-level hiring from Yapply's job data." }) +
  `<section class="section"><div class="wrap grid"><a class="card" href="#report-2026-11"><span class="eyebrow">November 2026</span><h3>New grad hiring report: November 2026</h3><p class="small muted">Open roles by industry, sponsorship share and deadlines.</p></a></div></section>` }));
route("report-2026-11", () => {
  const byRole = ROLES.map(r => [r.name, JOBS.filter(j => j.role === r.slug).length]).sort((a, b) => b[1] - a[1]);
  const max = Math.max(...byRole.map(x => x[1])); const sp = JOBS.filter(j => ["yes", "likely"].includes(j.sponsor)).length;
  const soon = JOBS.filter(j => j.deadline <= "2026-12-08").length;
  return { title: "New grad hiring report: November 2026", path: "/reports/2026-11-new-grad-hiring", crumbs: resCrumbs("Reports", "reports", "November 2026"),
    html: pageHead({ eyebrow: "Report · Data as of " + AS_OF, title: "New grad hiring report: November 2026", answer: `As of ${AS_OF}, Yapply tracked <b>${JOBS.length}</b> entry-level and intern roles at <b>${COMPANIES.length}</b> companies. <b>${Math.round(sp / JOBS.length * 100)}%</b> sponsor or are likely to sponsor H-1B, and <b>${soon}</b> close within two weeks.`, extra: `<p style="margin-top:12px">${DEMO} — the report format is real, the numbers are not.</p>` }) + `
    <section class="section"><div class="wrap grid-2"><div><h2>Open roles by role type</h2><p class="small muted">${byRole[0][0]} has the most open roles.</p><div class="bars" style="margin-top:12px">${byRole.map(([n, c], i) => `<div class="b ${i === 0 ? "on" : ""}"><span>${n}</span><div class="t"><i style="width:${c / max * 100}%"></i></div><b class="num">${c}</b></div>`).join("")}</div></div>
    <div class="stats"><div class="stat"><b>${JOBS.length}</b><span>open roles</span></div><div class="stat"><b>${sp}</b><span>sponsor or likely</span></div><div class="stat"><b>${soon}</b><span>close by Dec 8</span></div><div class="stat"><b>${JOBS.filter(j => j.level === "Internship").length}</b><span>internships</span></div></div></div></section>
    <section class="section"><div class="wrap prose"><h2>Methodology</h2><p>Counts include roles open on the snapshot date. See <a href="#methodology">how we collect job data</a>.</p></div></section>` };
});

route("methodology", () => ({ title: "Methodology", path: "/methodology", crumbs: [["Home", "home"], ["Methodology"]],
  html: pageHead({ eyebrow: "Resources", title: "How Yapply collects and labels job data", lead: "Where our numbers come from, how often they update and what each label means." }) + `
  <section class="section"><div class="wrap prose">
  <h2>Sources</h2><ul><li><b>Jobs:</b> employer career pages and public applicant tracking system feeds, checked every day.</li><li><b>Sponsorship history:</b> public H-1B data from USCIS and the US Department of Labor (LCA disclosures).</li><li><b>Hiring calendars:</b> the dates each employer opened and closed entry-level roles in previous seasons, from our own crawl history.</li></ul>
  <h2>Labels</h2><div class="tbl-wrap"><table><tr><th>Label</th><th>Meaning</th></tr><tr><td>${sponsorTag("yes")}</td><td>The job description says the employer sponsors, or it filed 40+ H-1B petitions in 3 years.</td></tr><tr><td>${sponsorTag("likely")}</td><td>The description is silent, but the employer sponsored similar roles in the last 3 years.</td></tr><tr><td>${sponsorTag("unknown")}</td><td>Little or no filing history.</td></tr><tr><td>${sponsorTag("no")}</td><td>The description says no sponsorship, or the role requires US person status.</td></tr></table></div>
  <h2>Entry-level only</h2><p>A role is included if its title or description says intern, new grad, entry level, university graduate or 0–2 years of experience.</p>
  <h2>Updates</h2><p>Jobs refresh daily. Closed roles are marked closed and removed after 30 days. Reports are published monthly.</p>
  <p class="small muted">This prototype uses fictional demo data in place of the sources above.</p></div></section>` }));

route("faq", () => ({ title: "FAQ", path: "/faq", crumbs: [["Home", "home"], ["FAQ"]],
  html: pageHead({ eyebrow: "Resources", title: "Frequently asked questions" }) + `<section class="section"><div class="wrap prose">${faqBlock(FAQ.map(([q, a]) => [q, a.replace("Compare.", '<a href="#compare">Compare</a>.')]))}</div></section>${ctaBand()}` }));

route("compare", () => ({ title: "Compare Yapply", path: "/compare", crumbs: [["Home", "home"], ["Compare"]],
  html: pageHead({ eyebrow: "Resources", title: "How Yapply compares", lead: "Honest side-by-side comparisons with other AI job search tools, based on public information." }) +
  `<section class="section"><div class="wrap grid">${COMPETITORS.map(c => `<a class="card" href="#compare-yapply-vs-${c.slug}"><h3>Yapply vs ${c.name}</h3><p class="small muted">${c.what}</p></a>`).join("")}</div></section>` }));
pattern(/^compare-yapply-vs-([a-z0-9-]+)$/, s => { const c = COMPETITORS.find(x => x.slug === s); if (!c) return null;
  const rows = [["Starts with", "10-minute voice conversation", "Your existing resume or preferences"], ["Built for", "US college students and new grads", "See their site"], ["Sponsorship labels", "On every job", s === "jobright" ? "Yes, H-1B filter" : "Check their site"], ["Applies for you", "Yes, after you review each one", s === "simplify" ? "Autofills forms you submit" : s === "teal" ? "No, it tracks applications" : "Yes"], ["Mock interviews", "Full-duplex voice", "Check their site"]];
  return { title: `Yapply vs ${c.name}`, path: `/compare/yapply-vs-${s}`, crumbs: resCrumbs("Compare", "compare", `Yapply vs ${c.name}`),
    html: pageHead({ eyebrow: "Compare", title: `Yapply vs ${c.name}`, answer: `<b>Choose ${c.name}</b> if you want ${c.strong[0].toLowerCase()}. <b>Choose Yapply</b> if you're a student with a thin resume and want it rebuilt from your real experience before you apply. ${c.diff}` }) + `
    <section class="section"><div class="wrap"><div class="tbl-wrap"><table><thead><tr><th></th><th>Yapply</th><th>${c.name}</th></tr></thead><tbody>${rows.map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table></div>
    <p class="small muted" style="margin-top:10px">Based on public information as of ${AS_OF}. Features and prices change; check <b>${c.name}</b>'s own site.</p></div></section>
    <section class="section"><div class="wrap grid-2"><div><h2>Where ${c.name} is strong</h2><ul class="prose">${c.strong.map(x => `<li>${x}</li>`).join("")}</ul><p class="muted">${c.what}</p></div><div><h2>Where Yapply is different</h2><p>${c.diff}</p><a class="btn primary" href="#signup">Try Yapply free</a></div></div></section>
    <section class="section"><div class="wrap"><h2>Other comparisons</h2><div class="row" style="margin-top:12px">${COMPETITORS.filter(x => x.slug !== s).map(x => `<a class="btn sm" href="#compare-yapply-vs-${x.slug}">Yapply vs ${x.name}</a>`).join("")}<a class="btn sm" href="#compare-${s}-alternatives">${c.name} alternatives</a></div></div></section>` }; });
pattern(/^compare-([a-z0-9-]+)-alternatives$/, s => { const c = COMPETITORS.find(x => x.slug === s); if (!c) return null;
  return { title: `${c.name} alternatives for students`, path: `/alternatives/${s}-alternatives`, crumbs: resCrumbs("Compare", "compare", `${c.name} alternatives`),
    html: pageHead({ eyebrow: "Alternatives", title: `${c.name} alternatives for new grads`, answer: `Popular alternatives to ${c.name}: ${COMPETITORS.filter(x => x.slug !== s).map(x => x.name).join(", ")} and Yapply. Pick based on whether you need help with what to say (Yapply), speed of applying, or organizing your search.` }) +
    `<section class="section"><div class="wrap grid"><a class="card" href="#home"><span class="tag hi">Yapply</span><h3>Yapply</h3><p class="small muted">Voice-first profile, tailored resumes, review before apply.</p></a>${COMPETITORS.filter(x => x.slug !== s).map(x => `<a class="card" href="#compare-yapply-vs-${x.slug}"><h3>${x.name}</h3><p class="small muted">${x.what}</p></a>`).join("")}</div></section>` }; });

// ---------- COMPANY ----------
route("about", () => ({ title: "About us", path: "/about", crumbs: [["Home", "home"], ["About"]],
  html: pageHead({ eyebrow: "Company", title: "We help students say what they've actually done", lead: "Most new grads have more experience than their resume shows. Yapply asks the questions a good career coach would, then does the busywork of applying." }) + `

const legal = (name, path, items) => route(name, () => ({ title: items.title, path, crumbs: [["Home", "home"], [items.title]],
  html: pageHead({ eyebrow: "Company · Draft", title: items.title, lead: "Draft placeholder for the prototype. Final text will be written with counsel before launch." }) + `<section class="section"><div class="wrap prose">${items.body.map(([h, p]) => `<h2>${h}</h2><p>${p}</p>`).join("")}</div></section>` }));

route("sitemap", () => {
  const groups = [
    ["Product", [["home", "Home"], ["how-it-works", "How it works"], ["features", "Features"], ...FEATURES.map(f => ["feature-" + f.slug, f.name]), ["pricing", "Pricing"], ["app", "Mobile App"], ["signup", "Sign up"]]],
    ["Opportunities", [["jobs", "All jobs"], ["jobs-internships", "Internships"], ["jobs-new-grad", "New grad"], ["jobs-remote", "Remote"], ["international-students", "International students"], ["h1b-jobs", "H1B jobs"], ...ROLES.map(r => ["jobs-" + r.slug + "-new-grad", r.name + " new grad"]), ...ROLES.map(r => ["h1b-jobs-" + r.slug, "H1B " + r.name]), ["jobs-software-engineer-new-grad-in-seattle", "SWE new grad in Seattle (example)"], ["companies", "Companies"], ...COMPANIES.map(c => ["company-" + c.slug, c.name]), ["company-juniper-cloud-interview", "Juniper Cloud interview (example)"], ["job-" + JOBS[0].id, "Job detail (example)"], ["lists-new-grad-2027", "New Grad 2027 list"], ["lists-summer-2027-internships", "Summer 2027 internships list"]]],
    ["Tools", [["tools", "All tools"], ...TOOLS.map(t => [t.id, t.name]), ...Object.keys(VERBS).map(v => ["tool-resume-synonyms-" + v, v + " synonyms"]), ...ROLES.map(r => ["tool-resume-skills-" + r.slug, r.name + " skills"])]],
    ["Resources", [["blog", "Blog"], ...BLOG.map(b => ["blog-" + b.slug, b.title]), ["help", "Help Center"], ["guides", "Guides"], ...GUIDES.map(g => ["guide-" + g.slug, g.title]), ["glossary", "Glossary"], ...GLOSSARY.map(g => ["glossary-" + g.slug, g.term]), ["interview-questions", "Interview questions"], ...Object.keys(IQ).map(k => ["interview-questions-" + k, IQ[k].name]), ["reports", "Reports"], ["report-2026-11", "November 2026 report"], ["methodology", "Methodology"], ["faq", "FAQ"], ["compare", "Compare"], ...COMPETITORS.map(c => ["compare-yapply-vs-" + c.slug, "Yapply vs " + c.name]), ...COMPETITORS.map(c => ["compare-" + c.slug + "-alternatives", c.name + " alternatives"])]],

});
